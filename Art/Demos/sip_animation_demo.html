<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sip: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#8fb52e;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t),3);
const eic=t=>{t=clamp(t);return t*t*t};
const TAU=Math.PI*2;
const sin=Math.sin,cos=Math.cos,exp=Math.exp,PI=Math.PI;
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++)if(t<k[i+1][0]){const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);return lerp(k[i][1],k[i+1][1],sm(u))}return k[k.length-1][1]}
const wrap=(t,d)=>((t%d)+d)%d;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(x,m)=>clamp(x,-m,m);

/* ---------- stage constants ---------- */
const SX=480,GY=540,K=.96,CX=110,CGY=402;   // stage centre, ground line, scale, rig pivot (bottom centre of the carton)
const SVG='http://www.w3.org/2000/svg';
const rig=$('#rig'),shadow=$('#shadow'),worldEl=$('#world'),fxG=$('#fx'),word=$('#word'),fm=$('#fm'),puddle=$('#puddle'),puddleH=$('#puddleH');
const JUICE='#f0b030';

/* ---------- tag the parts ---------- */
const strawEl=rig.querySelector('#part-straw'),bodyEl=rig.querySelector('#part-body');
const bp=[...bodyEl.children];
function wrapG(a,b,id){const g=document.createElementNS(SVG,'g');g.id=id;bp[a].before(g);for(let i=a;i<=b;i++)g.appendChild(bp[i]);return g}
bp[0].id='lid';bp[1].id='front';
wrapG(2,4,'side');wrapG(5,7,'apple');bp[6].id='leaf';bp[7].id='stem';
wrapG(8,9,'eyeL');bp[9].id='hlL';wrapG(10,11,'eyeR');bp[11].id='hlR';wrapG(12,13,'face');
/* bulge wrapper (cheek puff) + blush ovals */
const bulge=document.createElementNS(SVG,'g');bulge.id='bulge';bodyEl.before(bulge);bulge.appendChild(bodyEl);
for(const [id,cx,cy] of [['blushL',68,280],['blushR',165,272]]){const e=document.createElementNS(SVG,'ellipse');e.id=id;e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',24);e.setAttribute('ry',12);e.setAttribute('fill','#ff6f8c');e.setAttribute('opacity',0);bulge.appendChild(e)}
/* juice-in-the-straw overlay (inserted under the straw's shine lines) */
const JP='M22 94 C24 78 30 68 40 58 C52 46 64 33 78 32 C90 32 88 60 88 82 L88 124';
const juice=document.createElementNS(SVG,'path');juice.setAttribute('d',JP);juice.setAttribute('fill','none');juice.setAttribute('stroke',JUICE);juice.setAttribute('stroke-width',11);juice.setAttribute('stroke-linecap','butt');juice.setAttribute('opacity',0);
strawEl.children[1].after(juice);const JL=juice.getTotalLength();
const PIV={straw:[88,128],lid:[110,118],side:[190,250],apple:[100,205],leaf:[103,172],stem:[109,186],eyeL:[66,352],eyeR:[170,336],hlL:[90,339],hlR:[151,319],face:[115,365],blushL:[68,280],blushR:[165,272]};
const P={};for(const k in PIV){P[k]={el:k==='straw'?strawEl:rig.querySelector('#'+k),piv:PIV[k],last:''}}
P.straw.el.id='part-straw';
const inner=Object.keys(P);

let acc={};
function A(id,o){const a=acc[id]||(acc[id]={x:0,y:0,r:0,sx:1,sy:1,k:0});
  if(o.x)a.x+=o.x;if(o.y)a.y+=o.y;if(o.r)a.r+=o.r;if(o.k)a.k+=o.k;if(o.sx)a.sx*=o.sx;if(o.sy)a.sy*=o.sy}
const f2=n=>Math.round(n*100)/100;
function setT(id,s){const p=P[id];if(p.last!==s){p.last=s;if(s)p.el.setAttribute('transform',s);else p.el.removeAttribute('transform')}}

/* ---------- ground scribbles ---------- */
(function(){
  const g=$('#tufts'),far=$('#far');const R=rng(7);

 strawR(t){const sq=keys(t,[[0,0],[.5,1],[1.2,1],[1.5,0],[2,1],[2.8,1],[3.0,0]]);return 14*sq*sin(TAU*3.2*t)},
 state(t){let y=0,sy=1+.02*breath(t),r=0,sx0=1,k=0;
  const hop=(s,e,H)=>{const u=(t-s)/(e-s);return u>0&&u<1?H*4*u*(1-u):0};
  y=hop(.55,1.15,70)+hop(1.95,2.7,88);
  sy*=keys(t,[[0,1],[.2,.8],[.28,.82],[.36,1.2],[.9,1.08],[1.15,1.1],[1.22,.74],[1.34,1.08],[1.45,1],[1.7,1],[1.85,.76],[1.95,.8],[2.02,1.22],[2.55,1.08],[2.7,1.12],[2.78,.72],[2.92,1.08],[3.05,.99],[3.2,1]]);
  if(t>.55&&t<1.15)r=6*sin(PI*(t-.55)/.6);
  if(t>2.0&&t<2.72){const c=cos(TAU*sm((t-2.0)/.7));sx0=Math.abs(c)<.07?.07*Math.sign(c||1):c}
  return{b:B({y,r,sy,k,sx:volume(sy)*sx0})}},
 extra(t,st,T,Ac,api){
  const sq=keys(t,[[0,0],[.3,.6],[.5,1],[1.2,1],[1.5,0],[1.8,.4],[2,1],[2.8,1],[3.0,0]]);
  Ac('eyeL',{sy:1-.65*sq,sx:1+.12*sq});Ac('eyeR',{sy:1-.65*sq,sx:1+.12*sq});
  Ac('apple',{sx:1+.1*sin(TAU*3.2*t),sy:1-.1*sin(TAU*3.2*t)+.0,y:-5*sq*Math.abs(sin(TAU*1.6*t))});
  Ac('lid',{k:5*sq*sin(TAU*1.6*t)});
  st.blush=.85*sq;
  const [cx,cy]=toStage(110,120,0,st.b);
  confetti(t,.95,cx,cy-60,20,5,560,1.7);confetti(t,2.45,cx,cy-40,30,8,700,1.9);
  api.word('YAY!',SX+130,toStage(110,0,0,st.b)[1]-10,t,.62,.9,8);
  api.word('WHEE!',SX-140,toStage(110,0,0,st.b)[1]-10,t,2.1,.9,-8);
 }};
const ORDER=['idle','hop','squirt','slurp','hurt','happy'];
const LABEL={idle:'Idle',hop:'Hop',squirt:'Squirt',slurp:'Slurp',hurt:'Ouch',happy:'Yay'};

/* ---------- api ---------- */
let wordShown=false,curB=null,dustAt={};
const api={word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},
  puddle:(cx,cy,rx,a,t)=>{puddle.setAttribute('cx',f2(cx));puddle.setAttribute('cy',f2(cy));puddle.setAttribute('rx',f2(rx));puddle.setAttribute('ry',f2(rx*.16));puddle.setAttribute('opacity',f2(.9*clamp(a*2)));
    puddleH.setAttribute('cx',f2(cx-rx*.3));puddleH.setAttribute('cy',f2(cy-rx*.04));puddleH.setAttribute('rx',f2(rx*.28));puddleH.setAttribute('ry',f2(rx*.03));puddleH.setAttribute('opacity',f2(.8*clamp(a*2)));puddleOn=true},
  dust:(t,t0,idx)=>{const tau=t-t0;if(tau<0||tau>.5)return;const R=rng(60+idx);for(let i=0;i<6;i++){const dir=i<3?-1:1,v=(60+R()*90);fxAdd({k:'dot',x:SX+dir*(60+v*tau*1.2),y:GY-4-(18+R()*14)*Math.sin(PI*tau/.5)*.6,s:(1-tau/.5)*(.9+R()*.6),c:'#e6dcc2',a:.9})}}};
let puddleOn=false;

/* ---------- render ---------- */
let cur='idle',t0=0,speed=1,paused=false,T=0;
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;curB=b;acc={};fxList=[];wordShown=false;puddleOn=false;juice.setAttribute('opacity',0);
  const lag=d=>m.state(wrap(t-d,m.dur)).b;
  const vel=d=>{const a=lag(d),c=lag(d+.04);return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  /* ---- shared secondary motion (overlapping action) ---- */
  const v1=vel(.05),v2=vel(.1),v3=vel(.15);
  A('part-straw'==='x'?'':'straw',{r:(m.strawR?m.strawR(t):0)-cl(v2.x*.03,24)+cl(v2.r*.3,14)+3.2*sin(1.5*T)+cl(-v2.y*.01,8),sy:1-cl(v2.y*.00028,.14),k:cl(-v3.x*.012,8)+1.5*sin(2.1*T+1)});
  A('lid',{k:cl(-v1.x*.01,5),sy:1+cl(v2.y*.00012,.04)});
  A('leaf',{r:cl(-v2.x*.05,28)+cl(v2.y*.012,16)+6*sin(2.2*T+.4)});A('stem',{r:cl(-v2.x*.03,14)+3*sin(2.6*T)});
  A('apple',{y:cl(-v2.y*.01,7),sy:1+cl(v2.y*.00018,.06)});
  A('face',{x:cl(-v2.x*.01,4),y:cl(-v2.y*.008,3)});
  A('side',{k:cl(-v2.x*.008,4),sx:1-cl(v2.y*.00008,.04)});
  /* eyes: wander + blink */
  const lx=2.8*sin(.6*T)+1.4*sin(1.7*T+1),ly=1.2*sin(.9*T+2);const bl=blinkAmt(T);
  A('eyeL',{x:lx,y:ly,sy:1-.92*bl});A('eyeR',{x:lx,y:ly,sy:1-.92*bl});A('hlL',{x:lx*.8,y:ly*.8});A('hlR',{x:lx*.8,y:ly*.8});
  /* puff: eyes squeezed outward */
  const pf=st.puff||0;A('eyeL',{x:-5*pf});A('eyeR',{x:5*pf});
  m.extra(t,st,T,A,api);
  /* ---- rig ---- */
  rig.setAttribute('transform',`translate(${SX} ${GY}) scale(${K}) translate(${f2(b.x)} ${f2(-b.y)}) rotate(${f2(b.r)}) skewX(${f2(b.k)}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-CX} ${-CGY})`);
  const bx=1+.22*pf,by=1-.06*pf;
  bulge.setAttribute('transform',pf?`translate(110 380) scale(${f2(bx)} ${f2(by)}) translate(-110 -380)`:'');
  /* ---- parts ---- */
  const blush=Math.max(clamp(pf),st.blush||0);
  for(const id of inner){const a=acc[id];const p=P[id];
    if(!a){setT(id,'');continue}
    let s=`translate(${f2(p.piv[0]+a.x)} ${f2(p.piv[1]+a.y)}) rotate(${f2(a.r)}) skewX(${f2(a.k)}) scale(${f2(a.sx)} ${f2(a.sy)}) translate(${-p.piv[0]} ${-p.piv[1]})`;
    if(id==='blushL'||id==='blushR'){const z=1+.5*clamp(pf);s=`translate(${p.piv[0]} ${p.piv[1]}) scale(${f2(z)}) translate(${-p.piv[0]} ${-p.piv[1]})`}
    setT(id,s)}
  P.blushL.el.setAttribute('opacity',f2(blush*.8));P.blushR.el.setAttribute('opacity',f2(blush*.8));
  /* ---- shadow ---- */
  const hgt=Math.max(b.y,0);const sc=1/(1+hgt/230);
  const rx=118*K*sc*Math.min(Math.abs(b.sx),1.4)*(1.05)+Math.abs(b.sx)*0;
  shadow.setAttribute('cx',f2(SX+b.x*K+15));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(Math.max(rx,20)));shadow.setAttribute('ry',f2(Math.max(rx,20)*.15));shadow.setAttribute('opacity',f2(.95*(.4+.6*sc)));
  if(!puddleOn){puddle.setAttribute('opacity',0);puddleH.setAttribute('opacity',0)}
  /* ---- world ---- */
  let sc2=0;if(cur==='hop'&&m.scroll)sc2=m.scroll(t);
  tuftsM.setAttribute('transform',`translate(${f2(-(sc2%240))} 0)`);farM.setAttribute('transform',`translate(${f2(-((sc2*.3)%480))} 0)`);
  let shk=0;if(cur==='squirt'&&t>REL&&t<REL+.5)shk=exp(-9*(t-REL))*sin(65*(t-REL))*5;
  if(cur==='hurt'&&t>HT&&t<HT+.4)shk=exp(-9*(t-HT))*sin(70*(t-HT))*7;
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  drawFx();
}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__sip={seek(mode,t){setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();

</script>
</body></html>
