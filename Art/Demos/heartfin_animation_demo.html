<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartfin: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--pink:#ec86b6;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--pink);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:20px;height:18px;vertical-align:-4px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style></head>

      for(let j=1;j<=3;j++){const tj=tau-.05*j;if(tj<=0)continue;const [px,py]=pos(tj);fxAdd({k:j==2?'plus':'star',x:px+4*sin(j*5+k),y:py+8*j*.6,s:(1-j*.22)*.9,r:tj*300,c:j%2?'#FFF1A8':'#fbfaf6',a:1-j*.25})}
      if(tau>.62&&tau<.9)tgtGlow=max(tgtGlow,1);if(tau>.62)ty0=y1}
    const ta=tb+HEAL_LIFE*.78;
    if(t>=ta&&t<ta+.9){const u=t-ta;
      for(let j=0;j<5;j++){const R=rng(300+k*7+j);const a=-PI+R()*PI*.9-.2,v=90+R()*130;
        fxAdd({k:j%2?'plus':'star',x:930+cos(a)*v*u*.9,y:y1+sin(a)*v*u-20*u+60*u*u*.5,s:(1+R()*.9)*(1-u/.9*.5)*eob(u*8),r:R()*70,c:j%2?'#8be08d':'#FFF1A8',a:1-sm((u-.4)/.5)})}}}
  const lastArr=HEAL_T0+HEAL_STEP*(HEAL_N-1)+HEAL_LIFE*.78;
  const gT=sm((t-(HEAL_T0+HEAL_LIFE*.7))/.3)*(1-sm((t-lastArr-.4)/.9));

 }};
const y0c=hp=>hp[1]+60;
/* 5: hurt */
const HT=.45;
M.hurt={name:'Ouch!',dur:3.6,
 caption:'<b>Ouch.</b> A white then pink hit flash, <b>knockback</b> with a squash-then-stretch, the whole body wobbling on a decaying spring and the stack whipping at the top, eyes bulging then squeezing shut, the <b>smile flipping upside down</b>, arms, fins and legs flailing, a couple of tears, dizzy stars circling the head, then a little slide home.',
 state(t){const h=t-HT,o=form;let x=0,y=0,r=0,sx=1,sy=1,bend=0;
  if(h>0){const xk=lerp(115,200,o);x=-xk*eoc(h/.4);if(h>1.25)x=-xk*(1-sm((h-1.25)/.8));
    y=pxu(30,o)*sin(PI*clamp(h/.42))+(h>1.25&&h<2.05?pxu(9,o)*sin(PI*(h-1.25)/.8):0);
    r=-12*exp(-4.2*h)*cos(12*h)+(h>1.25&&h<2.1?3*sin(PI*(h-1.25)/.85):0);
    sx=1-.24*exp(-9*h)*cos(24*h);sy=1+.28*exp(-9*h)*cos(24*h);
    bend=-40*exp(-3*h)*cos(11*h)*bendK(o)-10*exp(-2*h)}
  else{sy=1+.028*breath(t);sx=volume(sy)}
  return{b:B({x,y,r,sx,sy,bend}),open:o,zoom:zoomOf(o),flash:flashAt(h)}},
 extra(t,st,T,A,api){const h=t-HT;
  if(h>0){const w=exp(-3*h);
   const eb=1+.5*exp(-1.5*h)*(h<.55?1:0);const sq=sm((h-.5)/.12)*(1-sm((h-1.7)/.4));
   A('eyeL',{sx:eb,sy:eb*(1-.85*sq)});A('eyeR',{sx:eb,sy:eb*(1-.85*sq)});
   A('smile',{sy:1-2.3*sm((h-.04)/.08)*(1-sm((h-1.9)/.4)),sx:1+.1*w});
   A('armL',{r:42*w*cos(14*h)});A('armR',{r:-42*w*cos(14*h+.4)});
   A('whiskL',{r:30*w*sin(16*h)});A('whiskR',{r:-30*w*sin(16*h+.5)});
   A('finL',{r:34*w*sin(15*h)});A('finR',{r:-34*w*sin(15*h+.4)});
   A('legL',{r:16*w*sin(14*h)});A('legX',{r:-14*w*sin(14*h)});A('legRL',{r:-16*w*sin(14*h)});A('legRS',{r:14*w*sin(14*h)});
   A('beat',{x:-.7*sm(h/.05)*exp(-3*h)+.6*bump(wrap(h-.3,.5),.2)*(h>.3&&h<1.6?1:0)});
   const hp=api.head(st);
   if(h<.3){const s=eob(h/.1)*(1-sm((h-.18)/.12));fxAdd({k:'spike',x:hp[0]+(form?60:90),y:hp[1]+(form?10:40),s:2.1*s,r:h*60,c:'#FFD23C',a:1})}
   api.word('OUCH!',hp[0]-150,hp[1]-(form?20:60),t,HT+.04,.8,-10);
   if(h>.3&&h<1.6){const u=h-.3;[-1,1].forEach((sg,i)=>{const ex=hp[0]+(sg<0?-34:36)*(form?.75:1.1),ey=hp[1]+(form?-4:4);
     const uu=(u-.1*i)%.9;if(uu>0)fxAdd({k:'drop',x:ex+sg*uu*34,y:ey+uu*uu*160+uu*18,s:.9*(1-uu/1.1),c:'#9ad7f2',a:1-sm((uu-.5)/.4)})})}
   if(h>.35&&h<1.9){const a=1-sm((h-1.5)/.4),[hx,hy]=api.head(st);
     for(let i=0;i<3;i++){const an=h*5+i*TAU/3;fxAdd({k:'star',x:hx+cos(an)*70,y:hy-70+sin(an)*18-sm((h-.35)/.15)*8,s:.9+.2*sin(an+1),r:an*40,c:i==1?'#f06a8a':'#FFD23C',a})}}
  }}};
function flashAt(h){if(h<0)return null;if(h<.06)return{a:.8,c:[1,1,1]};if(h<.12)return{a:.0,c:[1,1,1]};if(h<.2)return{a:.7,c:[1,1,1]};
  if(h<.8)return{a:.55*exp(-5*(h-.2)),c:[1,.35,.32]};return null}
/* 6: happy */
M.happy={name:'Yay!',dur:3.4,
 caption:'<b>Celebrate.</b> A squat and a springy hop with <b>arms flung up</b>, eyes squeezed into happy slits and a huge grin, then a bigger jump with a full <b>twirl</b> (the body flips edge-on and back) and a shower of pink hearts. The heartbeat races, the fins flap and the whole stack whips behind each motion.',
 state(t){const o=form;let y=0,sy=1+.02*breath(t),sxm=1,bend=0;
  const hop=(s,e,H)=>{const u=(t-s)/(e-s);return u>0&&u<1?H*4*u*(1-u):0};
  y=hop(.55,1.15,pxu(o?34:100,o))+hop(1.95,2.7,pxu(o?50:140,o));
  sy*=keys(t,[[0,1],[.2,.8],[.28,.82],[.36,1.2],[.9,1.08],[1.15,1.1],[1.22,.74],[1.34,1.08],[1.45,1],[1.7,1],[1.85,.76],[1.95,.8],[2.02,1.22],[2.55,1.08],[2.7,1.12],[2.78,.72],[2.92,1.08],[3.05,.99],[3.4,1]]);
  if(o)sy=1+(sy-1)*.55;
  if(t>2.0&&t<2.72)sxm=cos(TAU*sm((t-2.0)/.7));
  bend=(14*sin(TAU*1.6*t)*(t>.5&&t<1.3?1:0)+20*sin(PI*clamp((t-1.95)/.8))*cos(TAU*2*t))*bendK(o);
  const r=(t>.55&&t<1.15)?6*sin(PI*(t-.55)/.6):0;
  return{b:B({y,r,sy,sx:volume(sy)*sxm,bend}),open:o,zoom:zoomOf(o)}},
 extra(t,st,T,A,api){
  const up=keys(t,[[0,0],[.25,-.5],[.45,0],[.55,1],[1.15,1],[1.4,.2],[1.7,0],[1.85,-.5],[1.95,-.3],[2.02,1],[2.7,1],[2.95,.1],[3.4,0]]);
  armsUp(A,up>0?up*(26+8*sin(TAU*3.2*T)):up*14);
  A('whiskL',{r:up*18*sin(TAU*3.2*T)});A('whiskR',{r:-up*18*sin(TAU*3.2*T+1)});
  const sq=keys(t,[[0,0],[.3,.6],[.5,1],[1.2,1],[1.5,0],[1.8,.4],[2,1],[2.8,1],[3.1,0]]);
  A('eyeL',{sy:1-.7*sq,sx:1+.2*sq});A('eyeR',{sy:1-.7*sq,sx:1+.2*sq});
  A('smile',{sx:1+.35*sq,sy:1+.7*sq});
  A('finL',{r:sq*20*sin(TAU*3.6*T)});A('finR',{r:-sq*20*sin(TAU*3.6*T+.5)});
  A('legL',{r:sq*8*sin(TAU*3.2*T)});A('legRL',{r:-sq*8*sin(TAU*3.2*T)});
  A('beat',{x:lub(t,.5)*.8*sq});
  const hp=api.head(st);
  confetti(t,.95,hp[0],hp[1]-20,22,5,560,1.7);confetti(t,2.45,hp[0],hp[1]-20,30,8,700,1.9);
  rise(t,2.1,hp[0],hp[1],5,31,1.6,70,140);
  api.word('YAY!',hp[0]+150,hp[1]+10,t,.62,.9,8);
  api.word('WHEE!',hp[0]-160,hp[1]+10,t,2.1,.9,-8);
 }};
const ORDER=['idle','walk','unfold','heal','hurt','happy'];
const LABEL={idle:'Idle',walk:'Waddle',unfold:'Unfold',heal:'Heal',hurt:'Ouch',happy:'Yay'};

/* ---------- derived helpers ---------- */
let K=KB; let curB=null;
const api={S:(cx,cy)=>[SX+(cx-CX+curB.x)*K,GY+(cy-CGY-curB.y)*K],
  head:st=>{const ty=GAP*(1-clamp(st.open,0,1.08));return api.S(281,98+ty)},
  word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},
  glow:(tau,a,x,y,r)=>{if(a==null){glowOn=sm(1-tau/.6);glowPos=null}else{glowOn=a;glowPos=[x,y,r]}},
  tglow:(a,x,y)=>{tglowV=[a,x,y]}};
let wordShown=false,glowOn=0,glowPos=null,tglowV=null;

/* ---------- render ---------- */
let cur='idle',t0=0,speed=1,paused=false,T=0;
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;curB=b;K=KB*st.zoom;acc={};fxList=[];wordShown=false;glowOn=0;glowPos=null;tglowV=null;
  const lag=d=>m.state(wrap(t-d,m.dur)).b;
  const vel=d=>{const a=lag(d),c=lag(d+.04);return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  const A=add;const cl=(x,m)=>clamp(x,-m,m);
  const open=st.open;
  /* ---- shared secondary motion (overlapping action) ---- */
  const v1=vel(.05),v2=vel(.09),v3=vel(.13);
  A('armL',{r:-cl(v1.y*.02*K/.46,30)-cl(v1.x*.02,14)+4*sin(1.3*T)+cl(v1.r*.1,10)});
  A('armR',{r:cl(v2.y*.02*K/.46,30)-cl(v2.x*.02,14)+4*sin(1.1*T+1.2)+cl(v2.r*.1,10)});
  A('whiskL',{r:cl(v2.y*.02,22)+5*sin(2.2*T+.5)});A('whiskR',{r:-cl(v2.y*.02,22)+5*sin(2.0*T+1.3)});
  A('finL',{r:cl(v3.y*.016,20)+4*sin(1.9*T+.5)});A('finR',{r:-cl(v3.y*.016,20)+4*sin(1.7*T+1.1)});
  A('legL',{r:2.2*sin(1.1*T)+cl(v2.y*.012,8)});A('legX',{r:-2.2*sin(1.1*T+.8)-cl(v2.y*.01,7)});
  A('legRL',{r:-2.2*sin(1.1*T)-cl(v2.y*.012,8)});A('legRS',{r:2*sin(1.1*T+.8)+cl(v2.y*.01,7)});
  /* eyes: wander + blink */
  const lx=2.4*sin(.6*T)+1.2*sin(1.7*T+1),ly=1.2*sin(.9*T+2);const bl=blinkAmt(T);
  A('eyeL',{x:lx,y:ly,sy:1-.92*bl});A('eyeR',{x:lx,y:ly,sy:1-.92*bl});
  /* the small hearts beat softly on their own when the body is open */
  const bs=lub(T,1.6,.12);A('heartL',{sx:1+.07*bs,sy:1+.07*bs});A('heartR',{sx:1+.07*lub(T,1.6,.2),sy:1+.07*lub(T,1.6,.2)});A('heartIU',{sx:1+.07*lub(T,1.6,.3),sy:1+.07*lub(T,1.6,.3)});
  A('smile',{sx:1+.06*bs,sy:1+.1*bs});
  /* mode specifics */
  m.extra(t,st,T,A,api);
  const oc=clamp(open,0,1.08);
  const beat=(acc.beat?acc.beat.x:0)+lub(T,1.6)*(cur==='idle'?0:.0);
  /* ---- write rig transform ---- */
  rig.setAttribute('transform',`translate(${SX} ${GY}) scale(${f2(K)}) translate(${f2(b.x)} ${f2(-b.y)}) translate(0 ${-b.pv}) rotate(${f2(b.r)}) translate(0 ${b.pv}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-CX} ${-CGY})`);
  /* ---- bend: a lean that grows toward the top, arriving later the higher up ---- */
  const ty=GAP*(1-oc),Hc=CGY-(19+ty);
  const bnd=yd=>{const h=clamp((CGY-yd)/Hc,0,1);const bl=lag(.12*h).bend||0;return`translate(${f2(bl*h*h)} 0) translate(0 ${f2(yd)}) skewX(${f2(Math.atan(-2*bl*h/Hc)*180/PI)}) translate(0 ${f2(-yd)})`};
  /* ---- head ---- */
  const hs=1+.05*beat*(.35+.65*clamp(oc)),py=lerp(170,905-ty,1-clamp(oc));
  const hx=acc.head;
  setT('head',`${bnd(98+ty)} translate(0 ${f2(ty)}) translate(281 ${f2(py)}) scale(${f2(hs)}) translate(-281 ${f2(-py)}) ${loc('head',hx)}`);
  /* ---- tail: V and legs stay on the ground; only a beat pulse when folded ---- */
  const tb=1+.045*beat*(1-clamp(oc));
  tailAo.setAttribute('transform',`translate(275 905) scale(${f2(tb)}) translate(-275 -905)`);
  /* ---- accordion parts ---- */
  const hid=oc<.02;
  const ao=Math.max(oc,.001);
  for(const id of ACC){const p=P[id];
    if(hid){p.el.setAttribute('visibility','hidden');continue}p.el.removeAttribute('visibility');
    const yd=SEAM+ao*(p.yc-SEAM);
    const s=`${bnd(yd)} ${id==='tailB'?`translate(275 905) scale(${f2(tb)}) translate(-275 -905) `:''}translate(0 ${SEAM}) scale(1 ${f2(ao)}) translate(0 ${-SEAM}) ${loc(id,acc[id])}`;
    if(id==='tailB'){tailBo.setAttribute('transform',s)}else setT(id,s)}
  /* ---- simple parts ---- */
  for(const id of SIMPLE){const a=acc[id];
    if(!a){setT(id,'');continue}
    setT(id,loc(id,a))}
  /* ---- shadow ---- */
  const hgt=Math.max(b.y,0);const sc=1/(1+hgt/230);
  const rx=135*K*sc*(1+(1-b.sy)*.5);
  shadow.setAttribute('cx',f2(SX+b.x*K));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(rx));shadow.setAttribute('ry',f2(rx*.15));shadow.setAttribute('opacity',f2(.95*(.4+.6*sc)));
  /* ---- world ---- */
  let sc2=0;if(cur==='walk'&&m.scroll)sc2=m.scroll(T);
  tuftsM.setAttribute('transform',`translate(${f2(-(sc2%240))} 0)`);farM.setAttribute('transform',`translate(${f2(-((sc2*.3)%480))} 0)`);
  let shk=0;if(cur==='unfold'&&t>UT&&t<UT+.6)shk=exp(-8*(t-UT))*sin(60*(t-UT))*6;
  if(cur==='hurt'&&t>HT&&t<HT+.4)shk=exp(-9*(t-HT))*sin(70*(t-HT))*7;
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  /* ---- glow / flash / words ---- */
  if(glowOn>.01){let gx,gy,gr;if(glowPos){[gx,gy,gr]=glowPos;gr*=240*K/.46*.6}else{[gx,gy]=api.head(st);gy+=40;gr=230*K*(1.2-glowOn*.4)}
    glowC.setAttribute('cx',f2(gx));glowC.setAttribute('cy',f2(gy));glowC.setAttribute('r',f2(gr));glowC.setAttribute('opacity',f2(clamp(glowOn)))}else glowC.setAttribute('opacity',0);
  if(tglowV){glowT.setAttribute('cx',f2(tglowV[1]));glowT.setAttribute('cy',f2(tglowV[2]));glowT.setAttribute('r',f2(150+60*tglowV[0]));glowT.setAttribute('opacity',f2(tglowV[0]))}else glowT.setAttribute('opacity',0);
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  drawFx();
}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setForm(f){form=f;document.querySelectorAll('[data-form]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.form===f))}
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>setForm(+b.dataset.form));
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1);else if(k==='f'||k==='F')setForm(form?0:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__heartfin={seek(mode,t,f){if(f!=null)setForm(f);setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();
