<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webster: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#E8921C;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:26px;height:18px;vertical-align:-4px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
.chip{background:#3a3a3a}
</style></head>

  const g=$('#tufts'),far=$('#far');const R=rng(7);
  let h='';

   leg:LP({ph:TAU*5*t,amp:hit*32*exp(-1.1*hh)+9*(1-hit),w:.6,k:1,curl:hit*-14*exp(-1.5*hh)}),
   face:FACE({eye:1+.65*hit*exp(-1.2*hh),mouth:hit?.9*sm(h/.08)*(1-sm((h-1.2)/.3))*(.8+.2*sin(TAU*6*h)):0,brow:hit*-1.2*sm(h/.1)*(1-sm((h-1.3)/.8)),raise:hit*.8*exp(-2*hh),hr:hit*-8*exp(-2*hh),look:-1}),flash:flashAt(h)})},
 shake(t){const h=t-HT;return h>0&&h<.4?exp(-9*h)*sin(70*h)*7:0},
 extra(t,st,T,A,api){const h=t-HT;
  if(h>0){const [hx,hy]=api.S(158,85);
   if(h<.3){const s=eob(h/.1)*(1-sm((h-.18)/.12));fxAdd({k:'spike',x:hx-110,y:hy-10,s:2.1*s,r:h*60,c:'#FFD23C',a:1})}
   api.word('OUCH!',hx+40,Math.max(hy-170,80),t,HT+.04,.8,-10);
   if(h>.35&&h<1.9){const a=1-sm((h-1.5)/.4);
    for(let i=0;i<3;i++){const an=h*5+i*TAU/3;fxAdd({k:'star',x:hx+cos(an)*85,y:hy-62+sin(an)*16,s:.9+.2*sin(an+1),r:an*40,c:i==1?'#f06a8a':'#FFD23C',a})}}}}};
/* 6: yay (taunt) */
M.yay={name:'Yay! (taunt)',dur:3.6,
 caption:'<b>Taunt.</b> A crouch on the thread, then a <b>yo-yo</b> bounce up and down the line, a double <b>twirl</b> that shows his back, and a cackling jaw while every leg <b>waggles in a fast ripple</b>, a cocky brow raised. A confetti burst caps the spin and he sneers GOTCHA.',
 state(t){
  let L=475,th=0,sx=1,sy=1;
  const c=sm((t-.1)/.25)*(1-sm((t-.38)/.08));
  L+=-18*c;sy=1-.1*c;
  if(t>.4&&t<1.4){const u=t-.4;L=475+95*sin(TAU*u/.5)*exp(-.8*u)*(u<.99?1:0);sy*=1+.1*cos(TAU*u/.5)*exp(-1*u)}
  const ph2=TAU*2*sm((t-.9)/1.3)*(t>.9&&t<2.2?1:0)+(t>=2.2?TAU*2:0);
  sx=cos(ph2);
  const w=sm((t-1.6)/.3)*(1-sm((t-3.2)/.3));
  th=7*w*sin(TAU*t/.9);
  if(t>2.2&&t<2.8){const q=t-2.2;sy*=1-.1*exp(-8*q)*cos(26*q)}
  const hh=hang(L,th,th*.6,sx,sy);
  const lw=keys(t,[[0,0],[.6,0],[.9,1],[3.0,1],[3.4,0]]);
  return Object.assign(hh,{fl:flapP(TAU*2.5*t,16,30,-6),
   leg:LP({ph:TAU*5*t,amp:8+24*lw,w:.8,k:1,curl:0}),
   face:FACE({mouth:(.15+.85*abs(sin(TAU*3*t)))*lw*.7,brow:.6,raise:lw,squint:.45*lw,hr:6*w*sin(TAU*3.3*t),look:sin(TAU*t/1.2)*w})})},
 extra(t,st,T,A,api){const [cx,cy]=api.S(158,92);
  api.word('HEH HEH!',SX-170,170,t,.95,.8,-8);api.word('GOTCHA!',SX+160,150,t,2.35,.95,7);
  confetti(t,2.2,cx,cy-40,18,5,560,1.5)}};
const ORDER=['idle','walk','drop','shot','ouch','yay'];
const LABEL={idle:'Idle',walk:'Skitter',drop:'Web Drop',shot:'Web Shot',ouch:'Ouch',yay:'Taunt'};

/* ---------- render ---------- */
const threadEl=$('#thread');
let K=CH.K0,curB=null,wordShown=false,glowOn=0;
const api={S:(cx,cy)=>{const b=curB,dx=(cx-CH.PX)*b.sx,dy=(cy-CH.PY)*b.sy,c=cos(b.r*PI/180),s=sin(b.r*PI/180);return[SX+b.x+(dx*c-dy*s)*K,CH.CY-b.y+(dx*s+dy*c)*K]},
  word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},
  glow:()=>{}};
const rigT=(b,k)=>`translate(${f2(SX+b.x)} ${f2(CH.CY-b.y)}) scale(${f2(k)}) rotate(${f2(b.r)}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-CH.PX} ${-CH.PY})`;
const ghosts=[];for(let i=0;i<3;i++){const u=document.createElementNS(SVG,'use');u.setAttribute('href','#rigInner');u.setAttribute('visibility','hidden');$('#ghostG').appendChild(u);ghosts.push(u)}
let cur='idle',t0=0,speed=1,paused=false,T=0;
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;curB=b;K=CH.K0*(st.zoom||1);acc={};fxList=[];wordShown=false;
  const lag=d=>m.state(wrap(t-d,m.dur));
  const vel=d=>{const a=lag(d).b,c=lag(d+.04).b;return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  CH.common(add,T,st,vel,t);
  m.extra(t,st,T,add,api);
  rig.setAttribute('transform',rigT(b,K));
  for(const id of CH.ids){const a=acc[id];
    if(!a){setT(id,'');continue}
    const pv=P[id].piv;
    setT(id,`translate(${f2(pv[0]+a.x)} ${f2(pv[1]+a.y)}) rotate(${f2(a.r)}) skewX(${f2(a.k)}) scale(${f2(a.sx)} ${f2(a.sy)}) translate(${-pv[0]} ${-pv[1]})`)}
  CH.post&&CH.post(st,t,T,api);
  /* silk thread */
  if(st.thread){const th=st.thread;const sw=th.sway||0;const mx=(th.ax+th.tx)/2+sw,my=(th.ay+th.ty)/2;
    threadEl.setAttribute('d',`M${f2(th.ax)} ${f2(th.ay)} Q${f2(mx)} ${f2(my)} ${f2(th.tx)} ${f2(th.ty)}`);threadEl.setAttribute('opacity',1)}else threadEl.setAttribute('opacity',0);
  /* afterimages */
  ghosts.forEach((u,i)=>{const g=st.ghost||0;const al=g*[.34,.2,.1][i];
    if(al>.02){const lb=lag(.055*(i+1)).b;u.removeAttribute('visibility');u.setAttribute('transform',rigT(lb,K));u.setAttribute('opacity',f2(al))}else u.setAttribute('visibility','hidden')});
  /* trail polyline */
  if(st.trail&&st.trail.pts.length>1){trailEl.setAttribute('points',st.trail.pts.map(p=>f2(p[0])+','+f2(p[1])).join(' '));trailEl.setAttribute('opacity',f2(st.trail.a))}else trailEl.setAttribute('opacity',0);
  /* shadow */
  const feetY=CH.CY+(CH.FEET-CH.PY)*K-b.y,hgt=Math.max(0,GY-feetY);const sc=1/(1+hgt/260);
  const rx=CH.SHW*K*sc*(st.shw||1);
  shadow.setAttribute('cx',f2(SX+b.x));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(rx));shadow.setAttribute('ry',f2(rx*.15));shadow.setAttribute('opacity',f2(.95*(.35+.65*sc)));
  /* world */
  const sc2=m.scroll?m.scroll(t):0;
  tuftsM.setAttribute('transform',`translate(${f2(-(sc2%240))} 0)`);farM.setAttribute('transform',`translate(${f2(-((sc2*.5)%480))} 0)`);
  const shk=m.shake?m.shake(t):0;
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  drawFx();
}
/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__demo={seek(mode,t){setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();

</script>
