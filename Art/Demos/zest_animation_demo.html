<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zest: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#E8921C;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:26px;height:18px;vertical-align:-4px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style></head>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t),3);
const eic=t=>{t=clamp(t);return t*t*t};
const TAU=Math.PI*2;
const sin=Math.sin,cos=Math.cos,exp=Math.exp,PI=Math.PI,abs=Math.abs;
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++)if(t<k[i+1][0]){const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);return lerp(k[i][1],k[i+1][1],sm(u))}return k[k.length-1][1]}
const wrap=(t,d)=>((t%d)+d)%d;
const f2=n=>Math.round(n*100)/100;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* damped-spring response to a list of [time,target] steps (underdamped: overshoots and settles) */
function spr(t,ev,z=.42,w=15){let x=0,prev=0;const k=Math.sqrt(1-z*z),wd=w*k;
  for(const [s,v] of ev){const tau=t-s;if(tau>0){x+=(v-prev)*(1-exp(-z*w*tau)*(cos(wd*tau)+z/k*sin(wd*tau)))}prev=v}return x}

/* ---------- stage constants ---------- */
const SX=480,GY=540,BASE=.98,CX=122,CGY=409;   // stage centre-x, ground line, scale, rig pivot (character units: x centre, feet line)
const SVG='http://www.w3.org/2000/svg';
const rig=$('#rig'),shadow=$('#shadow'),worldEl=$('#world'),fxG=$('#fx'),word=$('#word'),glowC=$('#glowC'),fm=$('#fm');
const flyG=$('#flyG'),ringsG=$('#rings'),cardsG=$('#cards');

/* ---------- parts (pivots at real joints, character units) ---------- */
const IDS=['legL','legR','upper','stalk','leaf','wingL','wingR','face','eyeL','eyeR','beak','slice'];
const PIV={upper:[122,378],stalk:[110,74],leaf:[122,52],wingL:[42,255],wingR:[190,246],face:[121,162],beak:[112,152],legL:[102,380],legR:[132,380],slice:[185,374]};
const P={};
for(const id of IDS){const el=rig.querySelector('#'+id);const bb=el.getBBox();P[id]={el,piv:PIV[id]||[bb.x+bb.width/2,bb.y+bb.height/2],last:''}}
/* happy-eye arcs, drawn in the kid's thick marker line */
const hap={};
for(const s of ['L','R']){const e=P['eye'+s].piv;const p=document.createElementNS(SVG,'path');
  p.setAttribute('d',`M${e[0]-21} ${e[1]+9} Q${e[0]} ${e[1]-21} ${e[0]+21} ${e[1]+9}`);p.setAttribute('fill','none');p.setAttribute('stroke','#1a1a1a');p.setAttribute('stroke-width','9');p.setAttribute('opacity','0');
  P.face.el.appendChild(p);hap[s]=p}
let acc={};
function add(id,o){const a=acc[id]||(acc[id]={x:0,y:0,r:0,sx:1,sy:1,k:0});
  if(o.x)a.x+=o.x;if(o.y)a.y+=o.y;if(o.r)a.r+=o.r;if(o.k)a.k+=o.k;if(o.sx)a.sx*=o.sx;if(o.sy)a.sy*=o.sy}
function setT(id,s){const p=P[id];if(p.last!==s){p.last=s;if(s)p.el.setAttribute('transform',s);else p.el.removeAttribute('transform')}}

/* ---------- scenery ---------- */
(function(){
  const g=$('#tufts'),far=$('#far');let h='';
  for(let i=-1;i<6;i++){const x=i*240;
    h+=`<path d="M${x+60} 580 l-6 -20 M${x+66} 580 l2 -26 M${x+72} 580 l8 -20" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    /* little toadstool, kid style */
    h+=`<path d="M${x+176} 584 v-16" stroke="#1a1a1a" stroke-width="9" stroke-linecap="round"/><path d="M${x+176} 584 v-16" stroke="#fbfaf6" stroke-width="4" stroke-linecap="round"/><path d="M${x+156} 570 C${x+156} 548 ${x+196} 548 ${x+196} 570 Z" fill="#ef6d27" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/><circle cx="${x+168}" cy="561" r="3.2" fill="#fbfaf6"/><circle cx="${x+183}" cy="558" r="2.6" fill="#fbfaf6"/>`;
    h+=`<ellipse cx="${x+120}" cy="590" rx="11" ry="6" fill="#d9cfb8" stroke="#1a1a1a" stroke-width="3"/>`;
  }
  g.innerHTML=`<g id="tuftsM">${h}</g>`;
  let f='';
  for(let i=-1;i<5;i++){const x=i*240;
    f+=`<path d="M${x+60} 150 c-30 0 -34 -34 -6 -38 c4 -26 40 -28 50 -8 c24 -8 44 14 28 30 c8 14 -8 18 -22 16 Z" fill="#fff" stroke="#b7c2d3" stroke-width="3.5" stroke-linejoin="round" opacity=".85"/>`;
  }
  far.innerHTML=`<g id="farM">${f}</g>`;
})();
const tuftsM=$('#tuftsM'),farM=$('#farM');

/* ---------- fx pool ---------- */
const pool=[];for(let i=0;i<90;i++){const u=document.createElementNS(SVG,'use');u.setAttribute('stroke','#1a1a1a');u.setAttribute('stroke-width','2.5');u.style.display='none';fxG.appendChild(u);pool.push(u)}
let fxList=[];const fxAdd=o=>fxList.push(o);
function drawFx(){let i=0;
  for(const o of fxList){if(i>=pool.length)break;const u=pool[i++];
    u.style.display='';u.setAttribute('href','#s-'+o.k);u.setAttribute('fill',o.c);u.setAttribute('opacity',f2(o.a==null?1:o.a));
    u.setAttribute('transform',`translate(${f2(o.x)} ${f2(o.y)}) rotate(${f2(o.r||0)}) scale(${f2(o.s)})`);u.setAttribute('stroke-width',f2(2.5/Math.max(o.s,.3)))}
  for(;i<pool.length;i++)pool[i].style.display='none'}
const COL=['#f5a020','#FFD23C','#3f9060','#ef6d27','#f06a8a','#7cc3e8','#fbfaf6'];
function confetti(t,t0,ox,oy,n,seed,speed=520,life=1.6){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=-PI/2+(R()-.5)*2.3,v=speed*(.45+R()*.7),vx=cos(a)*v,vy=sin(a)*v;
    fxAdd({k:i%3?'scrap':'star',x:ox+vx*tau,y:oy+vy*tau+.5*900*tau*tau,s:(i%3?1.1:.9)*(.8+R()*.6),r:R()*360+tau*(R()-.5)*900,c:COL[i%COL.length],a:1-sm((tau-life*.55)/(life*.45))})}}
function juice(t,t0,ox,oy,n,seed,speed=300,life=.8,dir=0,spread=TAU){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=dir+(R()-.5)*spread,v=speed*(.5+R()*.6);fxAdd({k:'drop',x:ox+cos(a)*v*tau*(1-.3*tau),y:oy+sin(a)*v*tau+420*tau*tau,s:(1-tau/life*.6)*(.7+R()*.5),r:a*57.3+90,c:i%3?'#f5a020':'#FFD23C',a:1-sm((tau-life*.6)/(life*.4))})}}
function burst(t,t0,ox,oy,n,seed,speed,life){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=i/n*TAU+R()*.3,v=speed*(.6+R()*.5),d=eoc(tau/.6);fxAdd({k:'star',x:ox+cos(a)*v*d*.8,y:oy+sin(a)*v*d*.8,s:(.9+R()*.6)*(1-tau/life*.5),r:R()*360+tau*200,c:i%2?'#FFD23C':'#fbfaf6',a:1-sm((tau-life*.5)/(life*.5))})}}
function wordPop(txt,x,y,t,t0,life,rot=-8){const tau=t-t0;if(tau<0||tau>life)return false;
  const s=eob(tau/.14)*(1-sm((tau-life+.15)/.15)*.3);word.textContent=txt;word.setAttribute('opacity',f2(1-sm((tau-life+.12)/.12)));
  word.setAttribute('transform',`translate(${f2(x)} ${f2(Math.max(y,64))}) rotate(${rot}) scale(${f2(Math.max(s,.01))})`);return true}

/* ---------- blinks: mostly quick, some slow owl blinks (global time) ---------- */
const blinks=[];(function(){const R=rng(17);let t=1.1;for(let i=0;i<400;i++){const slow=R()<.3;blinks.push({t,d:slow?.78:.2,slow});if(!slow&&R()<.15)blinks.push({t:t+.27,d:.2});t+=1.4+R()*3.2+(slow?1.2:0)}})();
function blinkShape(u,slow){ // u in 0..1 -> closure 0..1
  if(!slow)return u<.35?u/.35:1-sm((u-.35)/.65);
  return u<.3?sm(u/.3):u<.58?1:1-sm((u-.58)/.42)}
function blinkAmt(T){let lo=0,hi=blinks.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(blinks[m].t<=T)lo=m;else hi=m-1}
  const e=blinks[lo],d=T-e.t;if(d<0||d>e.d)return 0;return blinkShape(d/e.d,e.slow)}
const slowBlink=(t,s,d=.9)=>{const u=(t-s)/d;return u<0||u>1?0:blinkShape(u,true)};

/* ---------- character-space -> stage space (matches the rig transform) ---------- */
let K=BASE;
function Sb(b,cx,cy){let x=(cx-CX)*b.sx,y=(cy-CGY)*b.sy+b.pv;const a=b.r*PI/180,c=cos(a),s=sin(a);
  const rx=x*c-y*s,ry=x*s+y*c;return [SX+(rx+b.x)*K,GY+(ry-b.pv-b.y)*K]}

const B=o=>Object.assign({x:0,y:0,r:0,sx:1,sy:1,pv:0},o);
const breath=t=>{const b=sin(TAU*t/4);return b+.25*sin(TAU*t/2)};
const volume=sy=>1+(1-sy)*.65;
const M={};

/* ===== 1: idle ===== */
const TILT=[[.9,13],[3.7,0],[5.1,-11],[7.0,0]];
M.idle={name:'Idle',dur:8,
 caption:'<b>Idle.</b> A slow breath with squash and stretch, and the classic <b>owl head tilt</b>: the face cocks to one side on a springy overshoot, then the other, while the body leans a hair the opposite way. Two <b>slow blinks</b> (lids sink, hold, rise) plus quicker ones, pupils that drift, the <b>stalk</b> and <b>leaf</b> swaying a beat behind, and the wing nub fidgeting.',
 state(t){const sy=1+.026*breath(t);return{b:B({sy,sx:volume(sy)})}},
 extra(t,st,T,A){const tf=spr(t,TILT);
  A('face',{r:tf,x:tf*.4,y:abs(tf)*-.08});A('upper',{r:-tf*.14});A('eyeL',{x:tf*.2});A('eyeR',{x:tf*.2});
  const sb=Math.max(slowBlink(t,2.3),slowBlink(t,5.7));A('eyeL',{sy:1-.93*sb});A('eyeR',{sy:1-.93*sb});
  A('beak',{r:tf*.4});
  const fid=exp(-((t-6.2)*(t-6.2))/.3)*sin(26*t);A('wingL',{r:10*fid});A('wingR',{r:-5*fid});
  const tap=clamp((t-4.4)/.5);A('legR',{r:tap<1?-9*sin(PI*tap)*sin(PI*tap*3):0});
  A('slice',{r:3*sin(TAU*t/4)})}};

/* ===== 2: waddle ===== */
const WC=.8,WSPD=150;
M.walk={name:'Waddle',dur:3.2,
 caption:'<b>Waddle.</b> Stubby legs swap steps, the body <b>rolls and bobs</b> over the planted foot, wings swing opposite the legs, and the owl keeps his <b>head level</b> against the sway (it lags a little, like a real owl). The little orange-slice wheel drops to the ground and <b>rolls</b> along. Stalk and leaf flop behind each step.',
 state(t){const ph=TAU*t/WC;const s=sin(ph);
  const sy=1-.035*(1-abs(s))+.01;const drop=sm(t/.3)*(1-sm((t-2.9)/.3));
  return{b:B({y:7*abs(s),r:2.6*s+3.2*drop,sy,sx:volume(sy)}),drop}},
 extra(t,st,T,A){const ph=TAU*t/WC;const s=sin(ph),c=cos(ph);
  A('upper',{r:5*s});A('face',{r:-5.5*sin(ph-.55),x:-s*2});
  A('eyeL',{x:4,y:-.5});A('eyeR',{x:4,y:-.5});
  A('legL',{r:34*c,x:-16*c,y:-10*Math.max(0,s)});A('legR',{r:-34*c,x:16*c,y:-10*Math.max(0,-s)});
  A('wingR',{r:-13*sin(ph+.5)-3});A('wingL',{r:13*sin(ph+.5)+3});
  A('beak',{y:abs(s)*-1.2});
  A('slice',{y:22*st.drop,r:675*t*st.drop+0});
  P.slice.keep=true},
 scroll(t){return WSPD*t}};

/* ===== 3: Seer (signature power) ===== */
const CARDS=[{x:176,y:284,icon:'star',a:1.35,rot:-7},{x:790,y:236,icon:'heart',a:1.8,rot:6},{x:812,y:456,icon:'slice',a:2.25,rot:-5}];
const SEER_T=1.0;
M.seer={name:'Seer',dur:6.4,
 caption:'<b>Seer (his power).</b> A long, slow <b>blink</b> and a head tilt gather the power, then his eyes <b>snap wide</b> with a glow and rippling rings, the wings flare, and he stretches tall. His head <b>scans left and right</b> while hidden things appear: a dotted path draws itself along the ground and three mystery cards flip over to show what was hiding.',
 state(t){let sy=1+.02*breath(t),y=0;
  if(t<SEER_T)sy=1-.07*sm((t-.1)/.8);else sy=keys(t,[[SEER_T,.93],[SEER_T+.14,1.11],[SEER_T+.4,.99],[SEER_T+.7,1.03],[SEER_T+1.2,1.01],[3.9,1.02],[4.6,1]])+.015*breath(t)*sm((t-4.6)/.6);
  y=t>SEER_T?9*eob((t-SEER_T)/.3)*(1-sm((t-3.7)/.8)):0;
  return{b:B({y,sy,sx:volume(sy)})}},
 extra(t,st,T,A,api){
  const tf=spr(t,[[.2,15],[SEER_T,0],[1.55,-13],[2.45,13],[3.35,-9],[4.3,0]]);
  A('face',{r:tf,x:tf*.4});A('upper',{r:-tf*.14});A('beak',{r:tf*.4});
  const closed=sm((t-.3)/.5)*(1-sm((t-SEER_T)/.05));
  const wide=keys(t,[[0,1],[SEER_T-.01,1],[SEER_T+.05,1.36],[SEER_T+.3,1.16],[3.9,1.16],[4.5,1]]);
  const look=keys(t,[[0,0],[1.2,0],[1.6,-5.5],[2.4,5.5],[3.3,-4],[3.9,0]]);
  for(const e of ['eyeL','eyeR']){A(e,{sy:(1-.93*closed)*wide,sx:wide,x:look,y:-wide*.6+.6})}
  const fl=keys(t,[[0,0],[SEER_T-.05,0],[SEER_T+.1,1],[SEER_T+.8,.55],[3.8,.55],[4.6,0]]);
  A('wingR',{r:-46*fl+3*sin(TAU*2.4*t)*fl});A('wingL',{r:46*fl-3*sin(TAU*2.4*t+1)*fl});
  A('stalk',{r:-4*fl});A('leaf',{r:-10*fl*sin(TAU*1.3*t)});
  const tau=t-SEER_T;
  if(tau>0){api.glowAt=sm(1-(t-3.6)/1.0)*(1-sm((.35-tau)/.35)*0)*(tau<.2?sm(tau/.1):1)*.9;
    api.shake=tau<.6?exp(-8*tau)*sin(60*tau)*5:0;
    api.word('SEER!',api.S(122,-40)[0]+10,api.S(122,-40)[1],t,SEER_T+.04,.95,-6);
    api.word('AHA!',api.S(122,-30)[0]+80,api.S(122,-30)[1]+10,t,2.75,.7,7);
    burst(t,SEER_T+.04,...api.S(122,160),18,4,420,1.0)}
  api.rings=[0,1,2].map(i=>({u:(t-(SEER_T+.05+i*.42))/1.25}));
  /* dotted path along the ground */
  for(let j=0;j<10;j++){const a=1.7+j*.11,u=t-a;if(u<0)continue;const fade=1-sm((t-4.2)/.6);if(fade<=0)continue;
    const x=585+j*24,y=GY+16+3*sin(j*1.3);fxAdd({k:'dot',x,y,s:(1.1+.15*sin(j))*eob(u/.25),c:j%2?'#FFD23C':'#f5a020',a:fade})}
  api.cardT=t},
 };

/* ===== 4: slice toss (action) ===== */
const REL=1.08,HIT=1.68,BACK=1.84,CATCH=2.62;
const wingTh=t=>keys(t,[[0,0],[.34,0],[.82,-152],[1.0,-156],[REL,-85],[1.22,-28],[1.4,6],[1.7,-2],[2.2,0]])+(t>1.4?4*exp(-6*(t-1.4))*sin(18*(t-1.4)):0);
const handCh=th=>{const r=th*PI/180;return[190+5*cos(r)-60*sin(r),246+5*sin(r)+60*cos(r)]};
const TARGET=[SX+340,320];
function tossState(t){
  const ly=keys(t,[[0,1],[.34,1],[.78,.9],[1.0,.93],[REL,1.08],[1.22,1],[1.7,1]]);
  const r=keys(t,[[0,0],[.4,0],[.9,-5],[1.02,-5],[1.14,8],[1.45,2],[1.8,0],[2.5,0]]);
  const x=keys(t,[[0,0],[1.0,0],[1.16,14],[1.6,6],[2.3,0]]);
  const y=10*sin(PI*clamp((t-2.45)/.42));
  const sy=ly*(1+.02*breath(t))*(t>CATCH?1:1);
  return B({x,y,r,sy,sx:volume(sy)})}
function slicePose(t){ // null when not drawn in flight; screen coords
