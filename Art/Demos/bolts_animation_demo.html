<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolts: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#3fae66;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:26px;height:18px;vertical-align:-4px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style></head>

function confetti(t,t0,ox,oy,n,seed,speed=520,life=1.6){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);

  sy*=keys(t,[[0,1],[.2,.8],[.28,.82],[.36,1.2],[.9,1.08],[1.15,1.1],[1.22,.74],[1.34,1.08],[1.45,1],[1.7,1],[1.85,.76],[1.95,.8],[2.02,1.22],[2.55,1.08],[2.7,1.12],[2.78,.72],[2.92,1.08],[3.05,.99],[3.2,1]]);
  let open=form;
  const lau=keys(t,[[0,0],[1.98,0],[2.1,1],[2.55,1],[2.8,0],[3.2,0]]);
  open=clamp(form+.28*lau*(form?-.5:1),0,1.1);
  if(t>2.0&&t<2.72){r=360*sm((t-2.0)/.7);pv=(434+STR*open)*.45}
  if(t>.55&&t<1.15)r=5*sin(PI*(t-.55)/.6);
  return{b:B({y,r,pv,sy,sx:volume(sy)}),open,hr:0}},
 extra(t,st,T,A,api){
  const up=keys(t,[[0,0],[.25,-.3],[.45,0],[.55,1],[1.15,1],[1.4,.2],[1.7,0],[1.85,-.3],[1.95,-.2],[2.02,1],[2.7,1],[2.95,.1],[3.2,0]]);
  const fl=sin(TAU*3.2*t);
  A('fist-l',{r:up>0?up*(125+14*sin(TAU*3.2*t)):up*40});A('fist-r',{r:-(up>0?up*(125+14*sin(TAU*3.2*t+1)):up*40)});
  const sq=keys(t,[[0,0],[.3,.6],[.5,1],[1.2,1],[1.5,0],[1.8,.4],[2,1],[2.8,1],[3.0,0]]);
  A('eye-l',{sy:1-.62*sq,sx:1+.12*sq});A('eye-r',{sy:1-.62*sq,sx:1+.12*sq});
  A('mouth',{sx:1+.5*sq,sy:1+.9*sq});
  A('bolt-l',{r:10*sq*sin(TAU*5*t)});A('bolt-r',{r:-10*sq*sin(TAU*5*t+1)});
  A('hair',{k:5*sq*sin(TAU*3.2*t)});
  if(st.open>.3){A('tongue',{k:8*sin(TAU*4*t)});A('throat',{sy:1+.08*sin(TAU*5*t)})}
  const [lx,ly]=api.S(BL[0]-8,BL[1]),[rx,ry]=api.S(BR[0]+8,BR[1]);
  for(const s0 of [.55,2.0]){sparks(t,s0,lx,ly,6,Math.floor(s0*7),220,.4);sparks(t,s0,rx,ry,6,Math.floor(s0*9),220,.4)}
  const [cx,cy]=api.S(216,BOT(st.open)-300);
  confetti(t,.95,cx,cy-80,20,5,560,1.7);confetti(t,2.45,cx,cy-40,30,8,700,1.9);
  api.word('YAY!',SX+150,80,t,.62,.9,8);api.word('WHEE!',SX-150,80,t,2.1,.9,-8);
 }};
const ORDER=['idle','walk','unfold','zap','hurt','happy'];
const LABEL={idle:'Idle',walk:'Lumber',unfold:'Unfold',zap:'Zap',hurt:'Ouch',happy:'Yay'};

/* ---------- render ---------- */
let K=1,curB=null,curO=0,wordShown=false,postS=null,batS=null;
const api={S:(cx,cy)=>{ // art point -> stage point (follows the rig transform, ignores per-part motion)
    const b=curB;let x=cx-CX,y=cy-BOT(curO);x*=b.sx;y*=b.sy;y+=b.pv;
    const c=cos(b.r*PI/180),s=sin(b.r*PI/180);const rx=x*c-y*s,ry=x*s+y*c;
    return[SX+(rx+b.x)*K,GY+(ry-b.pv-b.y)*K]},
  word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},
  posts:o=>{postS=o},bat:o=>{batS=o}};
let cur='idle',t0=0,speed=1,paused=false,T=0;
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;curB=b;curO=st.open;K=Kof(st.open);acc={};fxList=[];lgList=[];wordShown=false;postS=null;batS=null;
  glowL.setAttribute('opacity',0);glowR.setAttribute('opacity',0);
  const lag=d=>m.state(wrap(t-d,m.dur));
  const vel=d=>{const a=lag(d).b,c=lag(d+.04).b;return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  const A=add,cl=(x,m)=>clamp(x,-m,m);
  const v1=vel(.05),v2=vel(.09),v3=vel(.13);
  /* shared secondary motion */
  A('hair',{k:cl(-v2.x*.02,16)+1.8*sin(2.2*T+.5)+cl(v2.r*.06,10),sy:1-cl(v2.y*.00032,.2),sx:1+cl(v2.y*.00012,.08)});
  A('bolt-l',{r:cl(-v3.x*.012,14)+cl(-v3.y*.03,26)+cl(v3.r*.3,18)+2.4*sin(2.6*T)});
  A('bolt-r',{r:-(cl(v3.x*.012,14)+cl(-v3.y*.03,26)-cl(v3.r*.3,18))-2.4*sin(2.3*T+1.4)});
  A('fist-l',{r:cl(v2.y*.02,16)-cl(v2.x*.025,16)+3*sin(1.3*T)});A('fist-r',{r:-(cl(v2.y*.02,16)+cl(v2.x*.025,16))-3*sin(1.1*T+1)});
  A('scar',{y:cl(-v3.y*.006,3)});
  const lx=2.8*sin(.6*T)+1.4*sin(1.7*T+1),ly=1.2*sin(.9*T+2),bl=blinkAmt(T);
  A('eye-l',{x:lx,y:ly,sy:1-.92*bl});A('eye-r',{x:lx,y:ly,sy:1-.92*bl});
  A('throat',{sy:1+.03*sin(1.9*T)});A('tongue',{k:2*sin(1.3*T)});
  const L=lag(.07).b,Lo=lag(.05).open;
  const topLag={r:cl((L.r-b.r)*.5,3.5),y:cl((L.y-b.y)*-.08,4),sy:1+cl((st.open-Lo)/.05*.012,.07)+cl((L.sy-b.sy)*.5,.05)};
  /* rig transform first, so the modes can aim effects at body points */
  rig.setAttribute('transform',`translate(${SX} ${GY}) scale(${f2(K)}) translate(${f2(b.x)} ${f2(-b.y)}) translate(0 ${-f2(b.pv)}) rotate(${f2(b.r)}) translate(0 ${f2(b.pv)}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-CX} ${-f2(BOT(st.open))})`);
  m.extra(t,st,T,A,api);
  /* pull apart: body drops by the unfolded length, the inside stretches between */
  const o=st.open,sv=Math.max(clamp(o,0,1.15),.001);
  setT('part-body',`translate(0 ${f2(-STR*(1-o))})`);
  if(o<.02)inside.setAttribute('visibility','hidden');else inside.removeAttribute('visibility');
  setT('part-inside',`translate(0 ${HIN}) scale(1 ${f2(sv)}) translate(0 ${-HIN})`);
  const hr=(st.hr||0)+topLag.r;
  setT('part-head',`translate(0 ${f2(topLag.y)}) translate(212 ${HIN}) rotate(${f2(hr)}) scale(1 ${f2(topLag.sy)}) translate(-212 ${-HIN})`);
  for(const id of inner){const a=acc[id];
    if(!a){setT(id,'');continue}
    const pv=P[id].piv;
    setT(id,`translate(${f2(pv[0]+a.x)} ${f2(pv[1]+a.y)}) rotate(${f2(a.r)}) skewX(${f2(a.k)}) scale(${f2(a.sx)} ${f2(a.sy)}) translate(${-pv[0]} ${-pv[1]})`)}
  /* shadow */
  const sc=1/(1+Math.max(b.y,0)/230);
  const rx=(100*K+28)*sc*(1+(1-b.sy)*.5);
  shadow.setAttribute('cx',f2(SX+b.x*K));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(rx));shadow.setAttribute('ry',f2(rx*.15));shadow.setAttribute('opacity',f2(.95*(.4+.6*sc)));
  /* world */
  let sc2=0;if(cur==='walk'&&m.scroll)sc2=m.scroll(t);
  tuftsM.setAttribute('transform',`translate(${f2(-(sc2%240))} 0)`);farM.setAttribute('transform',`translate(${f2(-((sc2*.5)%480))} 0)`);
  let shk=0;
  if(cur==='unfold'){if(t>UT&&t<UT+.6)shk=exp(-8*(t-UT))*sin(60*(t-UT))*7;if(t>ARC0&&t<ARC0+.3)shk+=exp(-10*(t-ARC0))*sin(70*(t-ARC0))*4;const tc=t-CT;if(tc>.24&&tc<.5)shk=exp(-12*(tc-.24))*sin(70*tc)*5}
  if(cur==='hurt'&&t>HT&&t<HT+.4)shk=exp(-9*(t-HT))*sin(70*(t-HT))*7;
  if(cur==='zap'&&t>REL&&t<DIS)shk=exp(-3*(t-REL))*sin(80*(t-REL))*5;
  if(cur==='walk')for(let k=0;k<4;k++){const tau=t-k*STEP;if(tau>0&&tau<.25)shk+=exp(-14*tau)*sin(70*tau)*2.5}
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  wflash.setAttribute('opacity',f2(st.wf||0));
  drawPosts(postS);drawBat(batS);drawFx();drawLg();
}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setForm(f){form=f;document.querySelectorAll('[data-form]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.form===f))}
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>setForm(+b.dataset.form));
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1);else if(k==='f'||k==='F')setForm(form?0:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__bolts={seek(mode,t,f){if(f!=null)setForm(f);setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();

</script>
