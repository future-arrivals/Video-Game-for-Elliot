<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheriff Pinch: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--red:#c42a2f;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--red);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style></head>

const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t),3);
const TAU=Math.PI*2;
const sin=Math.sin,cos=Math.cos,exp=Math.exp,PI=Math.PI,abs=Math.abs;
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++)if(t<k[i+1][0]){const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);return lerp(k[i][1],k[i+1][1],sm(u))}return k[k.length-1][1]}
const wrap=(t,d)=>((t%d)+d)%d;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(x,m)=>clamp(x,-m,m);
const f2=n=>Math.round(n*100)/100;

/* ---------- stage constants ---------- */
const SX=480,GY=540,BASE=1.0,CX=189,CGY=337;   // stage centre, ground line, base scale, rig pivot (character units)
const SVG='http://www.w3.org/2000/svg';
const rig=$('#rig'),shadow=$('#shadow'),worldEl=$('#world'),fxG=$('#fx'),word=$('#word'),fm=$('#fm');

/* ---------- tag the parts: wrap loose paths into named, jointed groups ---------- */
const q=id=>rig.querySelector('#'+id);
function wrapG(id,kids){const g=document.createElementNS(SVG,'g');g.id=id;kids[0].before(g);kids.forEach(k=>g.appendChild(k));return g}
for(const n of ['l1','l2','l3','r1','r2','r3']){const g=q('leg-'+n);wrapG('lo-'+n,[g.children[0]])}   // pointed lower segment hangs off the knee
{const k=[...q('claw-left').children];const nt=wrapG('cl-notch',[k[3]]);const pn=wrapG('cl-pinch',[k[2],nt]);wrapG('cl-fore',[k[1],pn])}
{const k=[...q('claw-right').children];const nt=wrapG('cr-notch',[k[5]]);const pn=wrapG('cr-pinch',[k[4],nt]);wrapG('cr-fore',[k[1],k[2],k[3],pn])}
{const k=[...q('part-body').children];wrapG('eye-l',[k[2],k[3]]);wrapG('eye-r',[k[4],k[5]]);wrapG('smile',[k[6]])}
{const k=[...q('part-hat').children];wrapG('ear-l',[k[0]]);wrapG('ear-r',[k[1]]);wrapG('crown',[k[2],k[3],k[4],k[5]])}
wrapG('upper',[q('claw-left'),q('claw-right'),q('part-body'),q('part-hat')]);
const upper=q('upper'),clawR=q('claw-right'),bodyEl=q('part-body');
/* pivots at real joints (character units) */
const PIV={upper:[189,300],
 'leg-l1':[118,214],'leg-l2':[125,222],'leg-l3':[150,240],'leg-r1':[240,215],'leg-r2':[255,205],'leg-r3':[295,215],
 'lo-l1':[90,236],'lo-l2':[100,242],'lo-l3':[140,262],'lo-r1':[250,256],'lo-r2':[268,222],'lo-r3':[312,248],
 'claw-left':[114,208],'cl-fore':[98,198],'cl-pinch':[80,172],'cl-notch':[64,108],
 'claw-right':[268,200],'cr-fore':[300,192],'cr-pinch':[335,190],'cr-notch':[344,121],
 'part-body':[189,228],'eye-l':[148,129],'eye-r':[230,128],'smile':[185,160],
 'part-hat':[165,100],'ear-l':[146,92],'ear-r':[268,98],'crown':[210,98]};
const P={};for(const id in PIV)P[id]={el:q(id),piv:PIV[id],last:''};

let acc={};
function A(id,o){const a=acc[id]||(acc[id]={x:0,y:0,r:0,sx:1,sy:1});
  if(o.x)a.x+=o.x;if(o.y)a.y+=o.y;if(o.r)a.r+=o.r;if(o.sx)a.sx*=o.sx;if(o.sy)a.sy*=o.sy}
function setT(id,s){const p=P[id];if(p.last!==s){p.last=s;if(s)p.el.setAttribute('transform',s);else p.el.removeAttribute('transform')}}

/* ---------- sand nest (the kid's scribble) + ground tufts ---------- */
(function(){
  const g=$('#tufts');let h='';
  for(let i=-1;i<6;i++){const x=i*240;
    h+=`<path d="M${x+60} 580 l-6 -20 M${x+66} 580 l2 -26 M${x+72} 580 l8 -20" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    h+=`<ellipse cx="${x+150}" cy="590" rx="11" ry="6" fill="#d9cfb8" stroke="#1a1a1a" stroke-width="3"/>`;
    h+=`<path d="M${x+190} 586 l8 -16 l8 16 M${x+198} 570 v-14" stroke="#4aa24a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  }
  g.innerHTML=`<g id="tuftsM">${h}</g>`;
  let n='';const s=.95;
  for(let i=-1;i<3;i++)n+=`<use href="#nestArt" transform="translate(${480+i*640-201*s} 335) scale(${s}) translate(6 -146)"/>`;
  $('#nest').innerHTML=`<g id="nestM">${n}</g>`;
  let f='';
  for(let i=-1;i<4;i++){const x=i*480;
    f+=`<path d="M${x+120} 150 c-30 0 -34 -34 -6 -38 c4 -26 40 -28 50 -8 c24 -8 44 14 28 30 c8 14 -8 18 -22 16 Z" fill="#fff" stroke="#b7c2d3" stroke-width="3.5" stroke-linejoin="round" opacity=".85"/>`;
    f+=`<path d="M${x+380} 96 c-20 0 -22 -22 -4 -26 c4 -16 28 -18 34 -4 c16 -4 28 10 18 20 Z" fill="#fff" stroke="#b7c2d3" stroke-width="3" stroke-linejoin="round" opacity=".8"/>`;
  }
  f+=`<g transform="translate(830 88)" opacity=".9"><circle r="30" fill="#FFE27A" stroke="#d4a82a" stroke-width="3.5"/></g>`;
  $('#far').innerHTML=`<g id="farM">${f}</g>`;
})();
const tuftsM=$('#tuftsM'),farM=$('#farM'),nestM=$('#nestM');

/* ---------- fx pool ---------- */
const pool=[];for(let i=0;i<48;i++){const u=document.createElementNS(SVG,'use');u.setAttribute('stroke','#1a1a1a');u.setAttribute('stroke-width','2.5');u.style.display='none';fxG.appendChild(u);pool.push(u)}
let fxList=[];
const fxAdd=o=>fxList.push(o);
function drawFx(){
  let i=0;
  for(const o of fxList){if(i>=pool.length)break;const u=pool[i++];
    u.style.display='';u.setAttribute('href','#s-'+o.k);u.setAttribute('fill',o.c);u.setAttribute('opacity',f2(o.a==null?1:o.a));
    u.setAttribute('transform',`translate(${f2(o.x)} ${f2(o.y)}) rotate(${f2(o.r||0)}) scale(${f2(o.s)})`);u.setAttribute('stroke-width',f2(2.5/Math.max(o.s,.3)))}
  for(;i<pool.length;i++)pool[i].style.display='none';
}
const COL=['#c42a2f','#FFD23C','#8f4a22','#ef6d27','#f06a8a','#7cc3e8','#fbfaf6'];
function confetti(t,t0,ox,oy,n,seed,speed=520,life=1.6){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=-PI/2+(R()-.5)*2.3,v=speed*(.45+R()*.7),vx=cos(a)*v,vy=sin(a)*v;
    fxAdd({k:i%3?'scrap':'star',x:ox+vx*tau,y:oy+vy*tau+.5*900*tau*tau,s:(i%3?1.1:.9)*(.8+R()*.6),r:R()*360+tau*(R()-.5)*900,c:COL[i%COL.length],a:1-sm((tau-life*.55)/(life*.45))})}}
function crumbs(t,t0,ox,oy,n,seed,speed=260,life=.7,col='#e8cf8a'){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=(i/n)*TAU+R()*.6,v=speed*(.5+R()*.6);fxAdd({k:'dot',x:ox+cos(a)*v*tau*(1-.4*tau),y:oy+sin(a)*v*tau+300*tau*tau,s:(1-tau/life)*(.5+R()*.5),c:i%2?col:'#c9a45a',a:1})}}
function dustTrail(T,mv,dir){if(mv<.35)return;const sx=dir>0?-1:1;
  for(let k=0;k<6;k++){const f=wrap(T*3+k/6,1);fxAdd({k:'dot',x:api.S(189+sx*125,337)[0]+sx*f*46,y:api.S(189,337)[1]-4-f*32,s:(1-f)*.9,c:k%2?'#e8cf8a':'#c9a45a',a:.85*(1-f)*mv})}}
function wordPop(txt,x,y,t,t0,life,rot=-8){const tau=t-t0;if(tau<0||tau>life){return false}
  const s=eob(tau/.14)*(1-sm((tau-life+.15)/.15)*.3);word.textContent=txt;word.setAttribute('opacity',f2(1-sm((tau-life+.12)/.12)));
  word.setAttribute('transform',`translate(${f2(x)} ${f2(y)}) rotate(${rot}) scale(${f2(Math.max(s,.01))})`);return true}

/* ---------- blink + eye wander (global time) ---------- */
const blinks=[];(function(){const R=rng(11);let t=1.1;for(let i=0;i<400;i++){blinks.push(t);const r=R();if(r<.18){blinks.push(t+.26)}t+=1.3+R()*3.4+(r>.85?2.2:0)}})();
function blinkAmt(T){let lo=0,hi=blinks.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(blinks[m]<=T)lo=m;else hi=m-1}
  const d=T-blinks[lo];if(d<0||d>.2)return 0;return d<.07?d/.07:1-sm((d-.07)/.13)}

/* ---------- shared acting helpers ---------- */
const B=o=>Object.assign({x:0,y:0,r:0,sx:1,sy:1,pv:0},o);
const breath=t=>{const b=sin(TAU*t/3.2);return b+.25*sin(TAU*t/1.6)}
const volume=(sy)=>1+(1-sy)*.65;
const bump=(t,a,b,e=.3)=>t<a||t>b?0:sm((t-a)/e)*(1-sm((t-(b-e))/e));
/* claw snap: openness 1 = jaws wide, 0 = shut, with a little ring after the clack */
function snapAmt(t,evs,wind=.13){let o=0;for(const s of evs){const tau=t-s;
  if(tau>-wind&&tau<0)o=Math.max(o,sm((tau+wind)/wind));
  else if(tau>=0&&tau<.5)o=Math.max(o,0)+(-.28*exp(-11*tau)*cos(30*tau))}
  return o}
function clawPose(side,o,tilt=0){ // side 'l' or 'r'; o = openness
  const sg=side==='l'?1:-1,pre=side==='l'?'cl':'cr';
  A(pre+'-pinch',{sx:1+.2*o,r:-sg*9*o});A(pre+'-notch',{sy:1+3*Math.max(o,0),sx:1+.6*Math.max(o,0)});
  if(tilt)A(pre+'-fore',{r:sg*tilt})}
/* gait: two alternating tripods. dir -1..1, strength mv, phase ph */
function gait(ph,mv,dir){
  const L=[['l1',0],['r2',0],['l3',0],['r1',PI],['l2',PI],['r3',PI]];
  for(const [n,off] of L){const sgn=n[0]==='l'?1:-1,phi=ph+off;const lift=Math.max(0,sin(phi)),sw=cos(phi);
    A('leg-'+n,{r:sgn*lift*17*mv-dir*sw*11*mv});A('lo-'+n,{r:-sgn*lift*24*mv+dir*sw*5*mv})}}
const sidestep=(t,s)=>{const u=t-s;return u>0&&u<.5?sin(PI*u/.5):0};
/* hat tip with the right claw */
function tipAmt(t,s,e){return{k:sm((t-s)/.4)*(1-sm((t-(e-.4))/.4)),h:sm((t-s-.3)/.22)*(1-sm((t-(e-.55))/.25))}}
function applyTip(tp,T){
  A('claw-right',{r:-30*tp.k,y:-40*tp.k,x:-6*tp.k});A('cr-fore',{r:-14*tp.k});A('cr-pinch',{r:-4*tp.k});
  A('part-hat',{r:-18*tp.h,y:-9*tp.h,x:3*tp.h});A('ear-r',{r:-10*tp.h*sin(TAU*3*T)});A('upper',{r:-1.8*tp.k,x:-2*tp.k});
  A('eye-l',{sy:1-.45*tp.h});A('eye-r',{sy:1-.45*tp.h});A('smile',{sx:1+.5*tp.h,y:-1*tp.h});
  return tp.k>.05}

/* ---------- modes ---------- */
const M={};
/* 1: idle */
M.idle={name:'Idle',dur:6.4,
 caption:'<b>Idle.</b> Breathing squash-and-stretch, the hat <b>ears</b> and claws drifting a beat behind (overlapping action), <b>eyes</b> that look around and blink at irregular intervals, a quick <b>click-click</b> of each claw, a foot shuffle, and a courteous <b>hat tip</b> with the right claw.',
 state(t){const br=breath(t);const sy=1+.022*br;return{b:B({sy,sx:volume(sy),r:.8*sin(TAU*t/6.4)}),zoom:1}},
 extra(t,st,T,api){
  clawPose('l',snapAmt(t,[1.0,1.26]));clawPose('r',snapAmt(t,[4.9,5.16]));
  if(t>1.0)A('claw-left',{r:-4*exp(-9*(t-1.0))*sin(40*(t-1.0))});
  api.front=applyTip(tipAmt(t,2.5,4.1),T);
  const sh=sidestep(t,5.55);A('leg-l3',{r:14*sh});A('lo-l3',{r:-18*sh});A('upper',{x:1.5*sh,r:-1.2*sh});
  const sh2=sidestep(t,5.8);A('leg-r1',{r:-12*sh2});A('lo-r1',{r:16*sh2})}};

/* 2: scuttle */
const vSc=t=>330*bump(t,.15,1.95)-330*bump(t,2.3,3.95);
function distSc(t){let d=0;const n=Math.max(1,Math.ceil(t*120)),h=t/n;for(let i=0;i<n;i++)d+=vSc((i+.5)*h)*h;return d}
M.scuttle={name:'Scuttle',dur:4.0,
 caption:'<b>Sideways scuttle.</b> A crab only goes sideways: a lean-in, then <b>six legs in two alternating tripods</b> (lift, reach, plant, pull) with a rocking body, raised claws pumping and the <b>hat ears bouncing</b>. At the stop the claws click and he turns to scuttle back. The ground scrolls past, so he stays in frame.',
 state(t){const v=vSc(t),mv=clamp(abs(v)/220),dir=v/330;const ph=distSc(t)*.075;
  const bobY=2.6*abs(sin(ph))*mv,rr=dir*4.5+1.6*sin(2*ph)*mv;
  const sy=1-.025*mv*abs(sin(ph));
  return{b:B({y:bobY,r:rr,sy,sx:volume(sy)}),zoom:1,v,mv,dir,ph}},
 scroll(t){return distSc(t)},
 extra(t,st,T,api){
  const mv=st.mv,dir=st.dir;gait(st.ph,mv,dir);
  const lead=clamp(dir*1.4,-1,1);
  A('claw-right',{r:-(10+9*lead)*mv+3*sin(TAU*1.7*T)});A('claw-left',{r:(10-9*lead)*mv+3*sin(TAU*1.5*T+1)});
  A('cr-fore',{r:-8*mv*sin(2*st.ph)});A('cl-fore',{r:8*mv*sin(2*st.ph+1)});
  clawPose('l',snapAmt(t,[2.0,2.17,2.34]));clawPose('r',snapAmt(t,[2.08,2.25]));
  A('ear-l',{r:-7*mv*sin(2*st.ph-.6)});A('ear-r',{r:7*mv*sin(2*st.ph-.6)});
  A('eye-l',{x:dir*3});A('eye-r',{x:dir*3});
  dustTrail(T,mv,dir)}};

/* 3: the power - Pinch (snip a rope) */
const RX=130;                                   // how far he scuttles to reach the rope (character units)
const PT=[878,430],LG0=[222,505],RC=37;          // post tie, log start, log radius (stage pixels)
M.pinch={name:'Pinch (power)',dur:6.0,
 caption:'<b>Pinch.</b> His field power: <b>cut ropes, nets and seaweed</b>. He spots a rope holding a log, scuttles over, rears the claw back, <b>snips twice</b> (the first nicks, the second parts it), the rope ends whip back and the freed <b>log rolls away</b>, then a smug hat tip before he sidles home.',
 state(t){
  const xf=t=>RX*sm((t-.65)/1.25)*(1-sm((t-4.35)/1.3));
  const x=xf(t),vx=(xf(t+.02)-xf(t-.02))/.04;const mv=clamp(abs(vx)/110);
  const dir=t<3.5?1:-1;
  let y=0,sy=1,r=dir*3.5*mv;
  const crouch=sm((t-1.85)/.35)*(1-sm((t-2.5)/.06));sy*=1-.07*crouch;r-=4*crouch;
  const kick=t>2.58?exp(-8*(t-2.58))*sin(28*(t-2.58)):0;sy*=1+.06*kick;y+=5*kick;r-=2*kick;
  return{b:B({x,y,r,sy,sx:volume(sy)}),zoom:1,mv,dir,ph:x*.35,x}},
 extra(t,st,T,api){
  const mv=st.mv,dir=st.dir;
  gait(st.ph*.9,mv,dir*.8);
  const reach=sm((t-1.75)/.3)*(1-sm((t-3.0)/.45));
  const wind=sm((t-1.85)/.35)*(1-sm((t-2.3)/.05));
  const sn=snapAmt(t,[2.3,2.55],.16);
  A('claw-right',{r:-24*wind+62*reach-6*(1-reach)*mv});A('cr-fore',{r:-12*reach});
  clawPose('r',sn);
  A('claw-left',{r:-8*mv*(1+sin(TAU*2*T))+12*reach});clawPose('l',snapAmt(t,[2.34,2.6],.16));
  A('ear-l',{r:-6*mv*sin(T*20)});A('ear-r',{r:6*mv*sin(T*20)});
  const look=sm((t-.1)/.2)*(1-sm((t-3.0)/.4));
  A('eye-l',{x:5*look,y:2.5*look,sx:1+.12*look,sy:1+.12*look});A('eye-r',{x:5*look,y:2.5*look,sx:1+.12*look,sy:1+.12*look});
  const focus=sm((t-1.8)/.3)*(1-sm((t-2.6)/.2));A('eye-l',{sy:1-.25*focus});A('eye-r',{sy:1-.25*focus});
  A('upper',{r:3*reach});
  /* smug hat tip beat */
  const tp=tipAmt(t,3.3,4.3);
  if(tp.k>0){A('claw-right',{r:-30*tp.k,y:-40*tp.k,x:-6*tp.k});A('cr-fore',{r:-14*tp.k});A('part-hat',{r:-18*tp.h,y:-9*tp.h,x:3*tp.h});A('ear-r',{r:-10*tp.h*sin(TAU*3*T)});
   A('eye-l',{sy:1-.45*tp.h});A('eye-r',{sy:1-.45*tp.h});A('smile',{sx:1+.5*tp.h})}
  api.front=tp.k>.05;
  dustTrail(T,mv,dir);
  /* ---- the props: rope, post, log ---- */
  const pa=sm(t/.3)*(1-sm((t-4.2)/.3))+(t>4.5?sm((t-5.4)/.4):0);$('#props').setAttribute('opacity',f2(Math.min(1,pa)));
  const cut=t>=2.55,tauC=t-2.55;
  const roll=cut?150*sm(tauC/1.6)+(tauC>1.6?(tauC-1.6)*10:0):0;

  const u=.82,Cx=lerp(LG0[0]+RC*.55,PT[0],u),Cy=lerp(LG0[1]-RC*.55,PT[1],u)+sagBase*4*u*(1-u);
  const dp=(a,b,sag)=>`M${f2(a[0])} ${f2(a[1])} Q${f2((a[0]+b[0])/2)} ${f2((a[1]+b[1])/2+sag)} ${f2(b[0])} ${f2(b[1])}`;
  const setRope=(id,d)=>{for(const k of ['o','i','d'])$('#'+id+k).setAttribute('d',d)};
  if(!cut){const pull=nick*3;
    setRope('rL',dp(knot,[Cx,Cy+pull],sagBase*1.3*(1-u)));setRope('rR',dp([Cx,Cy+pull],PT,sagBase*1.3*u));
  }else{
    const e=1-exp(-6*tauC)*cos(15*tauC);              // damped spring 0 -> 1

    const tipR=[Cx+(PT[0]-Cx)*.5*e,Cy+(PT[1]-Cy)*.5*e+62*e];
    setRope('rL',dp(knot,tipL,18*(1-e*.5)+22*Math.max(0,1-e)));setRope('rR',dp(PT,tipR,16*(1-e*.4)));
  }

  api.word('SNAP!!',api.S(320,40)[0],api.S(320,40)[1]-60,t,2.56,.8,7);
  const [hx,hy]=api.S(372,232);

  crumbs(t,2.57,hx,hy,10,4,300,.7,'#e0b868');
  if(t>2.55&&t<2.8)api.shk=Math.max(api.shk,exp(-12*(t-2.55))*sin(70*(t-2.55))*4);
  if(t>2.34&&t<2.5)api.shk=Math.max(api.shk,exp(-14*(t-2.34))*sin(70*(t-2.34))*2.5);
 }};

/* 4: action - Pinch attack (battle move) */
M.attack={name:'Pinch attack',dur:3.2,
 caption:'<b>Pinch 2.</b> His battle attack. A wind-up with both claws thrown wide and rearing (jaws open, eyes narrowing), a fast <b>sideways lunge</b> that stretches the body and pushes in toward the camera, a <b>double snap</b> with a burst and screen shake, then a sliding recovery and a proud wiggle.',
 state(t){
  const wu=sm((t-.45)/.5)*(1-sm((t-.95)/.05));
  const lg=sm((t-.95)/.14)*(1-sm((t-1.5)/.7));

  const strech=sm((t-.95)/.05)*(1-sm((t-1.1)/.05));sx*=1+.2*strech;sy*=1-.1*strech;
  const rec=t>1.12&&t<1.7?exp(-8*(t-1.12))*cos(26*(t-1.12)):0;sy*=1-.1*rec;sx*=1+.08*rec;
  const settle=t>1.9?exp(-6*(t-1.9))*sin(18*(t-1.9)):0;
  const r=7*strech+(t>1.12&&t<2.0?-3*sin(PI*clamp((t-1.12)/.8)):0)+2*settle;

 extra(t,st,T,api){

  for(const [ts,sc] of [[1.1,1.9],[1.32,2.4]]){const tau=t-ts;if(tau>0&&tau<.28){const s=eob(tau/.07)*(1-sm((tau-.1)/.18));fxAdd({k:'spike',x:hx+(ts>1.2?24:0),y:hy-(ts>1.2?10:0),s:sc*s,r:tau*70,c:ts>1.2?'#FFD23C':'#fff',a:1})}}
  crumbs(t,1.34,hx,hy,14,8,380,.8,'#FFD23C');
  if(t>.95&&t<1.5)for(let k=0;k<5;k++){const f=wrap(T*3+k/5,1);fxAdd({k:'dot',x:api.S(189-125,337)[0]-f*46,y:api.S(189,337)[1]-4-f*32,s:(1-f)*.9,c:k%2?'#e8cf8a':'#c9a45a',a:.85*(1-f)})}

 }};

/* 5: hurt */
const HT=.45;
M.hurt={name:'Ouch! (hurt)',dur:3.6,
 caption:'<b>Ouch.</b> A white then pink hit flash, <b>knockback</b> with squash-then-stretch, a wobble on a decaying spring, eyes bulging, <b>claws flung up and whipping</b>, legs splayed, and the <b>hat popping off</b> to spin through the air and land back on his head, a little crooked. Dizzy stars circle, then he shakes it off.',
 state(t){const h=t-HT;let x=0,y=0,r=0,sx=1,sy=1;
  if(h>0){x=-96*eoc(h/.4);if(h>1.25)x=-96*(1-sm((h-1.25)/.8));

   r=-17*exp(-4.2*h)*cos(12*h)+(h>1.25&&h<2.1?4*sin(PI*(h-1.25)/.85):0);

 extra(t,st,T,api){const h=t-HT;
  if(h>0){const w=exp(-3*h);
   A('eye-l',{sx:1+.4*exp(-1.5*h),sy:1+.4*exp(-1.5*h)});A('eye-r',{sx:1+.4*exp(-1.5*h),sy:1+.4*exp(-1.5*h)});
   A('smile',{sy:1-2*exp(-1.4*h),y:3*exp(-1.4*h),sx:1.3});
   const up=exp(-2.2*h);
   A('claw-left',{r:34*up+30*w*cos(14*h)});A('claw-right',{r:-(34*up+30*w*cos(14*h+.4))});
   A('cl-fore',{r:20*w*sin(16*h)});A('cr-fore',{r:-20*w*sin(16*h+.4)});
   A('cl-pinch',{sx:1+.2*w});A('cr-pinch',{sx:1+.2*w});A('cl-notch',{sy:1+3*w});A('cr-notch',{sy:1+3*w});
   const sp=exp(-2*h);
   for(const n of ['l1','l2','l3'])A('leg-'+n,{r:14*sp+9*w*sin(15*h)});
   for(const n of ['r1','r2','r3'])A('leg-'+n,{r:-(14*sp+9*w*sin(15*h+.5))});
   for(const n of ['l1','l2','l3'])A('lo-'+n,{r:-10*w*sin(14*h)});for(const n of ['r1','r2','r3'])A('lo-'+n,{r:10*w*sin(14*h)});
   A('ear-l',{r:-26*w*sin(17*h)});A('ear-r',{r:26*w*sin(17*h+.4)});

   if(ht>0&&ht<.8){const g=1500,vy=500,hy=vy*ht-.5*g*ht*ht;A('part-hat',{y:-Math.max(hy,0),x:10*sin(ht*5)+ht*28*(1-ht),r:560*ht/.8})}
   else if(ht>=.8){const u=ht-.8;A('part-hat',{y:-5*exp(-9*u)*abs(sin(16*u)),r:14*exp(-4*u)*cos(14*u)+10*sm(u/.15)*(1-sm((u-1.0)/.7))})}
   const [bx,by]=api.S(340,230);
   if(h<.3){const s=eob(h/.1)*(1-sm((h-.18)/.12));fxAdd({k:'spike',x:bx+30,y:by-30,s:2.1*s,r:h*60,c:'#FFD23C',a:1})}
   api.word('OUCH!',api.S(189,-20)[0]-30,api.S(189,-70)[1],t,HT+.04,.8,-10);
   if(h>.35&&h<1.9){const a=1-sm((h-1.5)/.4),[hx,hy]=api.S(189,10);
    for(let i=0;i<3;i++){const an=h*5+i*TAU/3;fxAdd({k:'star',x:hx+cos(an)*80,y:hy+sin(an)*20-sm((h-.35)/.15)*8,s:.9+.2*sin(an+1),r:an*40,c:i==1?'#f06a8a':'#FFD23C',a})}}
   if(h>2.1&&h<2.7){const sh=sin(TAU*9*(h-2.1))*(1-sm((h-2.1)/.6));A('upper',{x:3*sh});A('ear-l',{r:12*sh});A('ear-r',{r:-12*sh})}
   if(h<.4)api.shk=Math.max(api.shk,exp(-9*h)*sin(70*h)*7);
  }}};
function flashAt(h){if(h<0)return null;if(h<.06)return{a:.8,c:[1,1,1]};if(h<.12)return{a:.0,c:[1,1,1]};if(h<.2)return{a:.7,c:[1,1,1]};
  if(h<.8)return{a:.55*exp(-5*(h-.2)),c:[1,.35,.32]};return null}

/* 6: happy */
M.happy={name:'Yay! (happy)',dur:3.4,
 caption:'<b>Celebrate.</b> A squat and springy hop with <b>both claws pumping</b> and clicking, eyes squeezed into happy slits, then a bigger jump with a <b>full spin</b> where he <b>tosses his hat</b> high and catches it on his head with a bounce, confetti and a final little tip.',
 state(t){let y=0,r=0,pv=0,sy=1+.02*breath(t);
  const hop=(s,e,H)=>{const u=(t-s)/(e-s);return u>0&&u<1?H*4*u*(1-u):0};
  y=hop(.55,1.15,95)+hop(1.8,2.55,140);
  sy*=keys(t,[[0,1],[.2,.8],[.28,.82],[.36,1.2],[.9,1.08],[1.15,1.1],[1.22,.74],[1.34,1.08],[1.45,1],[1.6,1],[1.7,.76],[1.8,.8],[1.88,1.22],[2.4,1.08],[2.55,1.12],[2.63,.72],[2.76,1.08],[2.9,.99],[3.4,1]]);
  if(t>1.85&&t<2.55){r=360*sm((t-1.85)/.7);pv=110}
  if(t>.55&&t<1.15)r=6*sin(PI*(t-.55)/.6);

 extra(t,st,T,api){
  const up=keys(t,[[0,0],[.25,-.4],[.45,0],[.55,1],[1.15,1],[1.4,.3],[1.65,0],[1.75,-.4],[1.85,-.2],[1.9,1],[2.55,1],[2.8,.2],[3.1,0]]);

  clawPose('l',snapAmt(t,[.62,.86,1.1,2.0,2.2,2.4],.07)*.9);clawPose('r',snapAmt(t,[.7,.94,1.18,2.1,2.3,2.5],.07)*.9);

 }};
const ORDER=['idle','scuttle','pinch','attack','hurt','happy'];
const LABEL={idle:'Idle',scuttle:'Scuttle',pinch:'Pinch',attack:'Attack',hurt:'Ouch',happy:'Yay'};

/* ---------- derived helpers ---------- */
let K=BASE; let curB=null;
const api={S:(cx,cy)=>[SX+(cx-CX+curB.x)*K,GY+(cy-CGY-curB.y)*K],
  word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},front:false,shk:0};
let wordShown=false;

/* ---------- render ---------- */
let cur='idle',t0=0,speed=1,paused=false,T=0;
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;curB=b;K=BASE*st.zoom;acc={};fxList=[];wordShown=false;api.front=false;api.shk=0;
  const lag=d=>m.state(wrap(t-d,m.dur)).b;
  const vel=d=>{const a=lag(d),c=lag(d+.04);return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  /* ---- shared secondary motion (overlapping action) ---- */
  const v2=vel(.09),v3=vel(.13);
  A('claw-left',{r:4*sin(1.3*T)+cl(v2.y*.03,18)-cl(v2.x*.02,10)});A('claw-right',{r:-4*sin(1.1*T+1.2)-cl(v2.y*.03,18)-cl(v2.x*.02,10)});
  A('cl-fore',{r:3*sin(1.7*T+.4)+cl(v3.y*.02,12)});A('cr-fore',{r:-3*sin(1.5*T+2)-cl(v3.y*.02,12)});
  A('ear-l',{r:cl(-v3.x*.03,18)+cl(v3.y*.03,16)+3*sin(2.6*T)});A('ear-r',{r:cl(-v3.x*.03,18)-cl(v3.y*.03,16)+3*sin(2.3*T+1.4)});
  A('part-hat',{r:cl(-v3.x*.012,5)+cl(v3.r*.12,5),y:cl(v3.y*.012,4)});
  A('crown',{sy:1-cl(v3.y*.0003,.05)});
  A('leg-l1',{r:1.6*sin(1.1*T)});A('leg-l2',{r:-1.6*sin(1.1*T+.8)});A('leg-l3',{r:1.4*sin(1.2*T+1.5)});
  A('leg-r1',{r:-1.6*sin(1.1*T)});A('leg-r2',{r:1.6*sin(1.1*T+.8)});A('leg-r3',{r:-1.4*sin(1.2*T+1.5)});
  for(const n of ['l1','l2','l3'])A('lo-'+n,{r:cl(v2.y*.015,8)});for(const n of ['r1','r2','r3'])A('lo-'+n,{r:-cl(v2.y*.015,8)});
  /* eyes: wander + blink */
  const lx=2.4*sin(.6*T)+1.2*sin(1.7*T+1),ly=1.1*sin(.9*T+2);const bl=blinkAmt(T);
  A('eye-l',{x:lx,y:ly,sy:1-.92*bl});A('eye-r',{x:lx,y:ly,sy:1-.92*bl});
  /* mode specifics */
  m.extra(t,st,T,api);
  /* while tipping the hat the claw is drawn in front of the hat */
  if(api.front){if(upper.lastElementChild!==clawR)upper.appendChild(clawR)}
  else if(upper.lastElementChild===clawR)bodyEl.before(clawR);
  /* ---- write rig transform ---- */
  rig.setAttribute('transform',`translate(${SX} ${GY}) scale(${f2(K)}) translate(${f2(b.x)} ${f2(-b.y)}) translate(0 ${-b.pv}) rotate(${f2(b.r)}) translate(0 ${b.pv}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-CX} ${-CGY})`);
  /* ---- apply accumulated part transforms ---- */
  for(const id in P){const a=acc[id];const p=P[id];
    if(!a){setT(id,'');continue}
    const pv=p.piv;
    setT(id,`translate(${f2(pv[0]+a.x)} ${f2(pv[1]+a.y)}) rotate(${f2(a.r)}) scale(${f2(a.sx)} ${f2(a.sy)}) translate(${-pv[0]} ${-pv[1]})`)}
  /* ---- shadow ---- */
  const hgt=Math.max(b.y,0);const sc=1/(1+hgt/230);
  const rx=150*K*sc*(1+(1-b.sy)*.5);
  shadow.setAttribute('cx',f2(SX+b.x*K));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(rx));shadow.setAttribute('ry',f2(rx*.15));shadow.setAttribute('opacity',f2(.95*(.4+.6*sc)));
  /* ---- world ---- */
  let sc2=0;if(cur==='scuttle')sc2=m.scroll(t);
  tuftsM.setAttribute('transform',`translate(${f2(-wrap(sc2,240))} 0)`);farM.setAttribute('transform',`translate(${f2(-wrap(sc2*.3,480))} 0)`);
  nestM.setAttribute('transform',`translate(${f2(-wrap(sc2,640))} 0)`);
  if(cur!=='pinch')$('#props').setAttribute('opacity',0);
  const shk=api.shk;
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  drawFx();
}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__pinch={seek(mode,t){setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();
</script>
