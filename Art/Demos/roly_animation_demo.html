<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roly: character animation demo</title>
<style>

*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#2f4cb2;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:26px;height:18px;vertical-align:-4px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }

.chip{background:#2f4cb2}
</style></head>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t),3);
const eic=t=>{t=clamp(t);return t*t*t};
const TAU=Math.PI*2,PI=Math.PI,DEG=180/PI;
const sin=Math.sin,cos=Math.cos,exp=Math.exp,abs=Math.abs;
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++)if(t<k[i+1][0]){const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);return lerp(k[i][1],k[i+1][1],sm(u))}return k[k.length-1][1]}
const wrapT=(t,d)=>((t%d)+d)%d;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(x,m)=>clamp(x,-m,m);
const f2=n=>Math.round(n*100)/100;

/* ---------- stage constants ---------- */

const SVG='http://www.w3.org/2000/svg';
const stageSvg=$('#stage'),rig=$('#rig'),shadow=$('#shadow'),worldEl=$('#world'),fxG=$('#fx'),word=$('#word'),glowC=$('#glowC'),fm=$('#fm');

/* ---------- tag the parts ---------- */

function fans(gid,pre){const ch=[...rig.querySelector('#'+gid).children];const gs=[];let c=null;
  for(const e of ch){if(e.getAttribute('fill')!=='none'||!c){c=[e];gs.push(c)}else c.push(e)}
  return gs.map((g,i)=>grp(g,pre+(i+1)).id)}

{ // green long friend: two tubes, the second ends in a claw
  const ch=[...rig.querySelector('#creature-green-long').children];

  grp(ta,'tube-a');const g=grp(tb,'tube-b');const c=document.createElementNS(SVG,'g');c.id='claw';g.appendChild(c);c.appendChild(cw)}
{ const ch=[...rig.querySelector('#creature-green-curl').children];grp(ch.slice(2),'curl-head');grp(ch.slice(0,2),'curl-body')}
{ const ch=[...rig.querySelector('#pink-head').children];
  grp(ch.slice(7,9),'o-eye-a');grp(ch.slice(9,11),'o-eye-b');grp(ch.slice(1,7),'o-mouth')}
const prop=document.createElementNS(SVG,'g');prop.id='prop';prop.setAttribute('visibility','hidden');
prop.innerHTML=`<g id="sack"><path d="M-30 14 C-46 40 -42 66 -18 73 L18 73 C42 66 46 40 30 14 C22 7 12 5 0 5 C-12 5 -22 7 -30 14Z" fill="#dcb86e" stroke="#1a1a1a" stroke-width="7"/><path d="M-13 9 C-8 1 8 1 13 9" fill="none" stroke="#1a1a1a" stroke-width="6"/><path d="M-10 6 C-11 -12 11 -12 10 6" fill="none" stroke="#1a1a1a" stroke-width="6"/><polygon transform="translate(0 42) scale(1.5)" points="0,-10 3,-3.5 10,-3 4.6,1.6 6.2,8.6 0,4.8 -6.2,8.6 -4.6,1.6 -10,-3 -3,-3.5" fill="#FFD23C" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g>`;

const ids=['pink-body','pink-head','o-mouth','o-eye-a','o-eye-b','shape-red','curl-body','curl-head','tube-a','tube-b','claw',...FL,...FR,'eye-top','eye-bottom','button','nose-mouth'];

  if(id==='claw')piv=[bb.x+bb.width/2,bb.y];
  if(id==='curl-body')piv=[265.9,335.7];if(id==='curl-head')piv=[212,212];
  if(/^fl/.test(id))piv=[bb.x+2,bb.y+bb.height*.45];if(/^fr/.test(id))piv=[bb.x+bb.width-2,bb.y+bb.height*.45];
  P[id]={el,piv,bb,last:''}}

const MOUTH=[P['o-mouth'].piv[0],P['o-mouth'].piv[1]];
let acc={};

  if(o.x)a.x+=o.x;if(o.y)a.y+=o.y;if(o.r)a.r+=o.r;if(o.k)a.k+=o.k;if(o.sx)a.sx*=o.sx;if(o.sy)a.sy*=o.sy}

/* ---------- fx pool ---------- */

const COL=['#d8463c','#FFD23C','#2f4cb2','#e8709c','#e57b3e','#33903f','#fbfaf6'];
function confetti(t,t0,ox,oy,n,seed,speed=520,life=1.6){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=-PI/2+(R()-.5)*2.3,v=speed*(.45+R()*.7),vx=cos(a)*v,vy=sin(a)*v;
    fxAdd({k:i%3?'scrap':'star',x:ox+vx*tau,y:oy+vy*tau+.5*900*tau*tau,s:(i%3?1.1:.9)*(.8+R()*.6),r:R()*360+tau*(R()-.5)*900,c:COL[i%COL.length],a:1-sm((tau-life*.55)/(life*.45))})}}
function crumbs(t,t0,ox,oy,n,seed,speed=260,life=.7,col='#FFD23C',col2='#e57b3e'){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=(i/n)*TAU+R()*.6,v=speed*(.5+R()*.6);fxAdd({k:'dot',x:ox+cos(a)*v*tau*(1-.4*tau),y:oy+sin(a)*v*tau+300*tau*tau,s:(1-tau/life)*(.5+R()*.5),c:i%2?col:col2,a:1})}}
function burst(t,t0,x,y,life=.35,s=1.3,c='#FFD23C'){const tau=t-t0;if(tau<0||tau>life)return;fxAdd({k:'spike',x,y,s:s*(.4+eoc(tau/life)*.9),r:tau*60,c,a:1-sm((tau/life-.4)/.6)})}
function wordPop(txt,x,y,t,t0,life,rot=-8){const tau=t-t0;if(tau<0||tau>life){return false}
  const s=eob(tau/.14)*(1-sm((tau-life+.15)/.15)*.3);word.textContent=txt;word.setAttribute('opacity',f2(1-sm((tau-life+.12)/.12)));

 flashOf(t){const tau=t-HT;return tau>0&&tau<.35?{a:.7*(1-tau/.35),c:[1,.25,.2]}:null}};
/* 6: yay */
const HOPS=[[.45,.55,0],[1.05,.6,0],[1.75,.65,1]];   // start, length, spin
function yayHop(t){for(let i=0;i<HOPS.length;i++){const[s,d,sp]=HOPS[i];if(t>=s&&t<s+d)return{i,u:(t-s)/d,sp,s,d}}return null}
M.yay={name:'Yay',dur:4.2,
 caption:'<b>Yay!</b> Squat, then three joyful hops, the last with a <b>full forward flip</b> in the air, a squash on each landing, a grin (the <b>nose-mouth</b> swells), squinting happy <b>eyes</b>, confetti and a word pop. Unfolded: the capsule bounces on its tubes while the <b>pink neck sways</b>, the <b>orange head</b> laughs, the <b>green curl</b> waves and the <b>feathers</b> flap in turn.',
 state(t,T){const br=breath(t);let y=0,sy=1+.02*br,r=0,x=0,spin=0;
  const hp=yayHop(t);const uf=formS>.5;

  if(hp){const u=hp.u;const H=(uf?[10,12,16]:[44,54,66])[hp.i];y=H*(1-Math.pow(2*u-1,2))*(u<.0?0:1);sy*=keys(u,[[0,1.18],[.3,1.1],[.5,1.0],[.8,1.08],[1,.96]]);
   if(hp.sp&&!uf)spin=TAU*sm((u-.08)/.84);r=(hp.i%2?-1:1)*4*sin(PI*u)}
  const sinceL=(()=>{let L=null;for(const[s,d]of HOPS)if(t>=s+d)L=s+d;return L==null?-9:t-L})();

  return{b:B({x,y:y+(uf?0:sq(th)*.0),r:r+th*DEG,pv:uf?0:201,sy,sx:volume(sy)}),o:formS,e:formS,joy:sm((t-.3)/.3)*(1-sm((t-3.7)/.4)),hp,lsq}},
 extra(t,st,T,A,api){const j=st.joy;
  A('eye-top',{sy:1-.5*j,sx:1+.06*j});A('eye-bottom',{sy:1-.5*j,sx:1+.06*j});
  A('nose-mouth',{sx:1+.35*j+.1*sin(14*T)*j,sy:1+.35*j-.1*sin(14*T)*j});A('button',{sx:1+.2*j,sy:1+.2*j,r:10*j*sin(10*T)});
  const uf=formS>.5;const[cx,cy]=api.S(uf?206:468,uf?20:150);

  if(uf){const p=sin(TAU*2.6*T);
   A('pink-body',{r:7*p,k:-7*p});A('pink-head',{r:12*sin(TAU*2.6*T+1),y:5*abs(p)});A('o-mouth',{sy:.65+.35*abs(sin(TAU*2.6*T))});
   A('curl-body',{r:12*sin(TAU*3*T)});A('curl-head',{r:15*sin(TAU*3*T+1)});A('shape-red',{sy:1+.05*abs(p)});
   FL.forEach((id,i)=>A(id,{r:15*sin(TAU*2.6*T+i*.7)}));FR.forEach((id,i)=>A(id,{r:-15*sin(TAU*2.6*T+i*.9+2)}));
   A('tube-a',{r:3*sin(TAU*2.6*T)});A('tube-b',{r:-3*sin(TAU*2.6*T+1)});
  }}};
const ORDER=['idle','roll','unfold','haul','ouch','yay'];

/* ---------- render ---------- */
let curB=null;
const api={S:(x,y)=>{const m=stageSvg.getScreenCTM().inverse().multiply(rig.getScreenCTM());const p=new DOMPoint(x,y).matrixTransform(m);return[p.x,p.y]},
  word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},
  glow:(tau,a,b)=>{glowOn=sm(1-tau/.7)*(tau>0?1:0)}};
let wordShown=false,glowOn=0;
let cur='idle',t0=0,speed=1,paused=false,T=0;
function pickForm(m){return m.forceForm!=null?m.forceForm:null}

  const m=M[cur];const t=wrapT(T-t0,m.dur);

  const A=add;
  rig.setAttribute('transform',`translate(${SX} ${GY}) scale(${f2(K)}) translate(${f2(b.x)} ${f2(-b.y)}) translate(0 ${-b.pv}) rotate(${f2(b.r)}) translate(0 ${b.pv}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${f2(-cxo)} ${f2(-gro)})`);
  const v1=vel(.05),v2=vel(.09),v3=vel(.13);
  /* ---- face: eyes wander and blink, button/nose lag behind ---- */
  const lx=2.6*sin(.6*T)+1.4*sin(1.7*T+1),ly=1.1*sin(.9*T+2);const bl=blinkAmt(T);
  const sqn=st.squint?1:0;
  A('eye-top',{x:lx,y:ly,sy:1-.9*Math.max(bl,sqn*.6)});A('eye-bottom',{x:lx*.8,y:ly*.8,sy:1-.9*Math.max(bl,sqn*.6)});
  A('button',{r:cl(v3.r*.25,14)+cl(-v3.x*.03,12)+2*sin(1.9*T),y:cl(v2.y*.01,6)});
  A('nose-mouth',{r:cl(v2.r*.12,8)+2*sin(2.3*T+1),sy:1+.03*sin(2.7*T)});
  /* ---- friends: pops + idle sway with overlapping action ---- */
  const g1=clamp(pop.pink),gh=clamp(pop.head),gc=clamp(pop.curl);
  A('pink-body',{sx:.7+.3*pop.pink,sy:Math.max(pop.pink,.001),r:g1*(2.4*sin(1.3*T)+cl(-v2.x*.03,10)+cl(v2.r*.2,8)),k:g1*(-3*sin(1.3*T+.7)+cl(v2.y*.01,6)),});
  A('pink-head',{sx:Math.max(pop.head,.001),sy:Math.max(pop.head,.001),r:(1-pop.head)*-200+gh*(3.2*sin(1.6*T+.5)),y:gh*(3.5*sin(2.1*T)+cl(-v3.y*.03,8))});
  A('o-mouth',{sy:1-.3*gh*(.5+.5*sin(1.4*T))*(cur==='idle'?1:0)*(1-clamp(abs(sin(.5*T)*2)))});
  const eb=blinkAmt(T,.7);A('o-eye-a',{sy:1-.9*eb});A('o-eye-b',{sy:1-.9*eb});
  A('shape-red',{sx:.8+.2*pop.red,sy:Math.max(pop.red,.001)*(1+.02*sin(1.1*T+1)),x:0});
  A('curl-body',{sx:Math.max(pop.curl,.001),sy:Math.max(pop.curl,.001),r:(1-pop.curl)*40+gc*(4*sin(1.9*T)+cl(-v2.x*.03,12)),k:gc*(2*sin(2.1*T))});
  A('curl-head',{r:gc*(9*sin(2.7*T+1)+cl(v3.r*.2,10))});
  FL.forEach((id,i)=>{const p=pop.fl[i];A(id,{sx:Math.max(p,.001),sy:.5+.5*p,r:(1-p)*-40+clamp(p)*(3.5*sin(2.2*T+.6*i)+cl(v2.y*.015,8))})});
  FR.forEach((id,i)=>{const p=pop.fr[i];A(id,{sx:Math.max(p,.001),sy:.5+.5*p,r:(1-p)*40+clamp(p)*(-3.5*sin(2.2*T+.6*i+1)+cl(-v2.y*.015,8))})});
  /* tubes: legs under the capsule; they absorb squat and keep their tips on the ground */
  const ts=clamp((gro-BAND+Math.min(b.y,0))/TUBE,.02,1.6)*clamp(e*1.15+.02);
  const tsy=Math.max(ts,.02);
  A('tube-a',{sy:tsy,r:clamp(e)*(1.5*sin(1.1*T)+cl(v3.x*.02,6))});
  A('tube-b',{sy:tsy,r:clamp(e)*(-1.5*sin(1.1*T+.8)-cl(v3.x*.02,6))});
  A('claw',{sy:1/tsy});
  /* mode specifics (may add to / override the above) */
  if(m.extra){m.extra(t,st,T,A,api)}

  /* ---- apply accumulated part transforms ---- */
  for(const id of ids){const a=acc[id];if(!a){setT(id,'');continue}
    const p=P[id];const pv=p.piv;

}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setForm(f){form=f;document.querySelectorAll('[data-form]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.form===f))}
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>setForm(+b.dataset.form));
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1);else if(k==='f'||k==='F')setForm(form?0:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;
  const m=M[cur];const want=m.forceForm!=null?m.forceForm:(cur==='unfold'?0:form);
  formS+=(want-formS)*(1-exp(-dt*7));if(abs(want-formS)<.002)formS=want;
  render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__roly={seek(mode,t,f){if(f!=null)setForm(f);setMode(mode);const m=M[cur];formS=m.forceForm!=null?m.forceForm:(cur==='unfold'?0:form);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
