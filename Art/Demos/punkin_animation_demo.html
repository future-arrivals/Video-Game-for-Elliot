<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punkin: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#f39b1c;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:26px;height:22px;vertical-align:-5px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style></head>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t),3);
const eic=t=>{t=clamp(t);return t*t*t};
const TAU=Math.PI*2;
const sin=Math.sin,cos=Math.cos,exp=Math.exp,PI=Math.PI,atan2=Math.atan2,hypot=Math.hypot;
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++)if(t<k[i+1][0]){const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);return lerp(k[i][1],k[i+1][1],sm(u))}return k[k.length-1][1]}
const wrap=(t,d)=>((t%d)+d)%d;
const cl=(x,m)=>clamp(x,-m,m);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- stage constants (character units = the unfolded SVG's own coordinates) ---------- */
const SX=480,GY=540,CX=205;
const GAP=422,BOTTOM=742,HINGE=190;          // jaw slide distance, lowest point of the unfolded shell, hinge line
const KF=1.2;                                // folded pumpkin is shown bigger (camera push-in)
const SVG='http://www.w3.org/2000/svg';
const rig=$('#rig'),shadow=$('#shadow'),worldEl=$('#world'),fxG=$('#fx'),word=$('#word'),glowC=$('#glowC'),fm=$('#fm'),tgt=$('#tgt'),tgtBoard=$('#tgtBoard');

/* ---------- tag the parts ---------- */
const strokeG=rig.firstElementChild;
const partTop=rig.querySelector('#part-top'),partBottom=rig.querySelector('#part-bottom'),inside=rig.querySelector('#part-inside');
const mk=id=>{const g=document.createElementNS(SVG,'g');g.id=id;return g};
function wrapKids(kids,idxs,id){const els=idxs.map(i=>kids[i]);const g=mk(id);els[0].parentNode.insertBefore(g,els[0]);els.forEach(e=>g.appendChild(e));return g}
const tk=[...partTop.children];
const g3head=tk[22];
wrapKids(tk,[0,1,2,3,4,5,6,7],'stem');
wrapKids(tk,[14,15],'triL');wrapKids(tk,[16,17],'triM');wrapKids(tk,[18,19,20,21],'triR');
/* ghost layers: back (behind the shell), mid (inside the mouth), front (flying in front) */
const gBack=mk('gBack'),gMid=mk('gMid'),gFront=mk('gFront');
strokeG.insertBefore(gBack,partBottom);inside.after(gMid);partTop.after(gFront);
const GH=[];
for(let n=1;n<=6;n++){
  const el=inside.querySelector('#ghost-'+n);const bb=el.getBBox();
  const gw=mk('gw-'+n);gMid.appendChild(gw);gw.appendChild(el);
  GH.push({n,el,gw,hx:bb.x+bb.width/2,hy:bb.y+bb.height/2,fs:[.72,1.2,1.3,2.3,1.95,1.85][n-1],layer:'mid',vis:true,last:''});
}
/* ghost 3 peeks out of the shell: its head lives in part-top, so in flight a clone of the head rides with it */
const g3=GH[2];g3.hx=248.5;g3.hy=187.5;
const headClone=g3head.cloneNode(true);headClone.removeAttribute('id');headClone.firstElementChild.setAttribute('fill','#f7ef5c');headClone.style.display='none';g3.el.appendChild(headClone);
/* ghost sub-parts */
const gk=n=>[...GH[n-1].el.children];
const k1=gk(1),k4=gk(4),k5=gk(5);
wrapKids(k1,[3,4,5,6],'g1eyes');
const k6=gk(6);
const el=id=>rig.querySelector('#'+id);
const PIV={stem:[170,98],triL:[100,160],triM:[195,178],triR:[294,168],g3head:[240,188],
 g1armR:[268,322],g1armL:[122,385],g1eyes:[204,300],g1mouth:[212,345],g4arm:[98,582],g5armL:[168,583],g5armR:[212,586],g6tongue:[308,583]};
const P={};
function reg(id,e){P[id]={el:e,piv:PIV[id],last:''}}
['stem','triL','triM','triR'].forEach(id=>reg(id,el(id)));
reg('g3head',g3head);reg('g1eyes',el('g1eyes'));
reg('g1armR',k1[0]);reg('g1armL',k1[1]);reg('g1mouth',k1[k1.length-1]);
reg('g4arm',k4[1]);reg('g5armL',k5[0]);reg('g5armR',k5[1]);reg('g6tongue',k6[k6.length-1]);
partBottom.removeAttribute('transform');

let acc={};
function add(id,o){const a=acc[id]||(acc[id]={x:0,y:0,r:0,sx:1,sy:1,k:0});
  if(o.x)a.x+=o.x;if(o.y)a.y+=o.y;if(o.r)a.r+=o.r;if(o.k)a.k+=o.k;if(o.sx)a.sx*=o.sx;if(o.sy)a.sy*=o.sy}
const f2=n=>Math.round(n*100)/100;
function setAttr(e,s){if(e._t!==s){e._t=s;if(s)e.setAttribute('transform',s);else e.removeAttribute('transform')}}

/* ---------- ground scribbles, tombstones, moon ---------- */
(function(){
  const g=$('#tufts'),far=$('#far');
  let h='';

    r=-17*exp(-4.2*h)*cos(12*h)+(h>1.25&&h<2.1?4*sin(PI*(h-1.25)/.85):0);
    sx=1-.24*exp(-9*h)*cos(24*h);sy=1+.28*exp(-9*h)*cos(24*h);shock=exp(-2.2*h);jo=exp(-4*h)*sin(32*h)}
  else{sy=1+.028*breath(t);sx=volume(sy)}
  const open=form?1+.07*jo:Math.max(0,.1*jo*(h>0?1:0)+.02*shock*(h>0?1:0));
  return{b:B({x,y,r,sx,sy}),open,zo:.64,flash:flashAt(h),shock}},
 extra(t,st,T,A,api){const h=t-HT;
  if(h>0){const w=exp(-3*h);
   A('triL',{sx:1+.35*exp(-1.5*h),sy:1+.4*exp(-1.5*h),r:-8*w*cos(14*h)});A('triR',{sx:1+.35*exp(-1.5*h),sy:1+.4*exp(-1.5*h),r:8*w*cos(14*h)});A('triM',{sx:1+.3*exp(-1.5*h),sy:1+.45*exp(-1.5*h)});
   A('g3head',{sx:1+.28*exp(-2*h),sy:1+.28*exp(-2*h),r:10*w*sin(20*h)});
   A('stem',{r:34*w*cos(13*h),sy:1+.1*w*sin(20*h)});
   const [bx,by]=api.S(390,300);
   if(h<.3){const s=eob(h/.1)*(1-sm((h-.18)/.12));fxAdd({k:'spike',x:bx+20,y:by-20,s:2.1*s,r:h*60,c:'#f7ef5c',a:1})}
   api.word('OUCH!',api.S(CX,0)[0]-40,api.S(CX,-30)[1]+10,t,HT+.04,.8,-10);
   if(h>.35&&h<1.9){const a=1-sm((h-1.5)/.4),[hx,hy]=api.S(CX,-18);
     for(let i=0;i<3;i++){const an=h*5+i*TAU/3;fxAdd({k:'star',x:hx+cos(an)*80,y:hy+sin(an)*20-sm((h-.35)/.15)*8,s:.9+.2*sin(an+1),r:an*40,c:i==1?'#f06a8a':'#f7ef5c',a})}}
  }}};
function flashAt(h){if(h<0)return null;if(h<.06)return{a:.8,c:[1,1,1]};if(h<.12)return{a:.0,c:[1,1,1]};if(h<.2)return{a:.7,c:[1,1,1]};
  if(h<.8)return{a:.55*exp(-5*(h-.2)),c:[1,.35,.32]};return null}
/* 6: happy */
M.happy={name:'Yay!',dur:4.6,
 caption:'<b>Celebrate.</b> A squat and a springy hop with the <b>stem twirling</b> and the face triangles bouncing, then a bigger jump where the <b>jaw pops open and the ghosts burst out</b> to celebrate with him, looping the pumpkin once before dropping back in as he lands and snaps shut. A confetti burst tops it off.',
 state(t){let y=0,r=0,sy=1+.02*breath(t);
  const hop=(s,e,H)=>{const u=(t-s)/(e-s);return u>0&&u<1?H*4*u*(1-u):0};
  y=hop(.55,1.15,100)+hop(1.95,2.7,108);
  sy*=keys(t,[[0,1],[.2,.8],[.28,.82],[.36,1.2],[.9,1.08],[1.15,1.1],[1.22,.74],[1.34,1.08],[1.45,1],[1.7,1],[1.85,.76],[1.95,.8],[2.02,1.22],[2.55,1.08],[2.7,1.12],[2.78,.72],[2.92,1.08],[3.05,.99],[3.2,1],[4.6,1]]);
  if(t>.55&&t<1.15)r=6*sin(PI*(t-.55)/.6);if(t>1.95&&t<2.7)r=-5*sin(PI*(t-1.95)/.75);
  const jo=jaw(t,1.97,4.0);const open=form?1:jo;
  return{b:B({y,r,sy,sx:volume(sy)}),open,zo:.44}},
 ghost(i,t,st,ctx){const k=CAT.indexOf(i);return orbitPose(i,t,2.05+.08*k,1.6,1,.8,70,clamp(st.open,0,1),CX,380,2.05,k)},
 extra(t,st,T,A,api){
  const tw=keys(t,[[0,0],[.55,0],[1.15,1],[1.4,1],[1.95,1],[2.7,1],[3.0,0]]);
  const j1=t>.55&&t<1.15?sin(PI*(t-.55)/.6):0,j2=t>1.95&&t<2.7?sin(PI*(t-1.95)/.75):0;
  A('stem',{r:360*sm((t-.62)/.5)+ -360*0+360*sm((t-2.0)/.6)*0+(t>2.0&&t<2.7?-360*sm((t-2.0)/.6):0)});
  A('triL',{sy:1+.2*sin(TAU*3.2*t)*(j1+j2),r:-8*(j1+j2)});A('triR',{sy:1+.2*sin(TAU*3.2*t+1)*(j1+j2),r:8*(j1+j2)});A('triM',{sy:1+.25*sin(TAU*3.2*t+2)*(j1+j2)});
  A('g3head',{y:-3*(j1+j2),r:7*sin(TAU*3.2*t)*(j1+j2)});
  const [cx,cy]=api.S(CX,420);

  api.word('YAY!',api.S(CX,0)[0]+130,api.S(CX,-30)[1]+10,t,.62,.9,8);

 }};
const ORDER=['idle','hop','unfold','dive','hurt','happy'];
const LABEL={idle:'Idle',hop:'Hop',unfold:'Unfold',dive:'Dive',hurt:'Ouch',happy:'Yay'};

/* ---------- render ---------- */
let curB=null,curK=1,curBOT=BOTTOM,curSX=SX;
const api={S:(cx,cy)=>[curSX+(cx-CX+curB.x)*curK,GY+(cy-curBOT-curB.y)*curK],
  C:(X,Y)=>[CX+(X-curSX)/curK-curB.x,curBOT+(Y-GY)/curK+curB.y],
  word:(txt,x,y,t,t0,life,rot)=>{if(wordPop(txt,x,y,t,t0,life,rot))wordShown=true},
  glow:(a,cx,cy)=>{glowOn=Math.max(glowOn,a);glowPos=[cx,cy]}};
let wordShown=false,glowOn=0,glowPos=[CX,400];
let cur='idle',t0=0,speed=1,paused=false,T=0;
function layerOf(g,z){const L=z>0?'front':z<0?'back':'mid';if(g.layer!==L){g.layer=L;(L==='front'?gFront:L==='back'?gBack:gMid).appendChild(g.gw)}}
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;
  const o=clamp(st.open,-.04,1.12);
  const K=lerp(KF,st.zo||.64,clamp(o,0,1));
  const BOT=BOTTOM-GAP*(1-o);
  curB=b;curK=K;curBOT=BOT;curSX=st.sx||SX;acc={};fxList=[];wordShown=false;glowOn=0;
  const lag=d=>m.state(wrap(t-d,m.dur)).b;
  const vel=d=>{const a=lag(d),c=lag(d+.04);return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  const A=add;
  const v2=vel(.09),v3=vel(.13);
  /* shared secondary motion */
  A('stem',{r:cl(-v2.x*.03,22)+cl(v2.r*.35,14)+3.5*sin(1.9*T)-cl(v2.y*.05,16)*0,sy:1-cl(v2.y*.00045,.2),sx:1+cl(v2.y*.00018,.08)});
  const bl=blinkAmt(T);
  A('triL',{sy:1-.8*bl});A('triR',{sy:1-.8*bl});A('triM',{sy:1-.8*bl});
  const bl2=blinkAmt(T+2.7),gl=sin(.7*T)*3;
  A('g3head',{x:gl,sy:1-.5*bl2});
  const L=lag(.07);
  const topLag={r:cl((L.r-b.r)*.6,6),sy:1+cl((L.sy-b.sy)*.7,.07),y:cl((L.y-b.y)*-.1,5)};
  /* ghost pose context */
  const ctx={S:api.S,C:api.C,ang:[]};
  if(cur==='dive'){for(let k=0;k<6;k++){const H=HOV[k],I=IMP[k];ctx.ang[k]=atan2(I[0]-H[0],-(I[1]-H[1]))*180/PI}}
  const poses=GH.map((g,i)=>m.ghost?m.ghost(i,t,st,ctx):null);
  m.extra(t,st,T,A,api);
  /* ---- rig transform ---- */
  rig.setAttribute('transform',`translate(${f2(curSX)} ${GY}) scale(${f2(K)}) translate(${f2(b.x)} ${f2(-b.y)}) translate(0 ${-b.pv}) rotate(${f2(b.r)}) translate(0 ${b.pv}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-CX} ${f2(-BOT)})`);
  /* ---- jaw, top, lining ---- */
  const ty=GAP*(1-o);const rh=(st.rh||0)+topLag.r;
  setAttr(partTop,`rotate(${f2(rh)} ${CX} ${HINGE}) translate(${CX} ${HINGE}) scale(1 ${f2(topLag.sy)}) translate(${-CX} ${-HINGE}) translate(0 ${f2(topLag.y)})`);
  const jy=cl(v2.y*.012,8)*Math.min(1,o*2);
  setAttr(partBottom,`translate(0 ${f2(-ty+jy)})`);
  const sv=Math.max(o,.001);
  const insVis=o>.012;
  inside.setAttribute('visibility',insVis?'visible':'hidden');
  setAttr(inside,`translate(0 ${HINGE}) scale(1 ${f2(sv)}) translate(0 ${-HINGE})`);
  /* ---- ghosts ---- */
  const vg=[0,1,2,3,4,5].map(i=>vel(.07+.03*i));
  const rest=sm((o-.32)/.5);
  GH.forEach((g,i)=>{
    const p=poses[i];const a=p?p.a:0;let x,y,r=0,sx=1,sy=1,s,z=0;
    const bobx=2.5*sin(1.3*T+i*1.7),boby=4.5*sin(1.7*T+i*2.3);
    const shk=st.shock||0;
    if(p){x=p.x+bobx*(1-a);y=p.y+boby*(1-a);r=p.r;sx=p.sx;sy=p.sy;s=lerp(rest,g.fs*p.sz,a);z=p.z}
    else{x=g.hx+bobx;y=HINGE+(g.hy-HINGE)*o+boby*rest;s=rest;
      y+=cl(vg[i].y*.035,26);x+=cl(-vg[i].x*.03,20);r=cl(-vg[i].x*.03,12)+cl(vg[i].r*.2,10)+3*sin(1.1*T+i);
      x+=shk*5*sin(44*T+i*2);y+=shk*4*sin(37*T+i);r+=shk*8*sin(33*T+i)}
    const vis=s>.03;
    if(vis!==g.vis){g.vis=vis;g.gw.setAttribute('visibility',vis?'visible':'hidden')}
    if(vis){layerOf(g,z);setAttr(g.gw,`translate(${f2(x)} ${f2(y)}) rotate(${f2(r)}) scale(${f2(sx*s)} ${f2(sy*s)}) translate(${-g.hx} ${-g.hy})`)}
    if(i===2){const fly=a>.04;headClone.style.display=fly?'':'none';g3head.style.display=fly?'none':''}
    /* limbs: wave at rest, flap in flight */
    const fl=1+3*a;const w=(1-a)*1+a*1;
    if(i===0){A('g1armR',{r:(8+14*a)*sin(2.1*T*fl)+shk*20*sin(30*T)});A('g1armL',{r:-(7+10*a)*sin(1.8*T*fl+1)-shk*18*sin(31*T)});
      A('g1eyes',{x:2*sin(.5*T),sy:1-.9*blinkAmt(T+3.3)});A('g1mouth',{sx:1+.1*sin(2*T)+.25*a,sy:1+.12*sin(2.4*T)+.3*a})}
    if(i===3)A('g4arm',{r:(14+16*a)*sin(3*T*fl)});
    if(i===4){A('g5armL',{r:-(12+18*a)*sin(3.1*T*fl)});A('g5armR',{r:(12+18*a)*sin(3.1*T*fl+1)})}
    if(i===5)A('g6tongue',{r:12*sin(4*T)+10*a*sin(10*T)});
  });
  /* ---- apply accumulated part transforms ---- */
  for(const id in P){const a=acc[id],p=P[id];
    if(!a){setAttr(p.el,'');continue}
    const pv=p.piv;
    setAttr(p.el,`translate(${f2(pv[0]+a.x)} ${f2(pv[1]+a.y)}) rotate(${f2(a.r)}) skewX(${f2(a.k)}) scale(${f2(a.sx)} ${f2(a.sy)}) translate(${-pv[0]} ${-pv[1]})`)}
  /* ---- trails behind flying ghosts ---- */
  GH.forEach((g,i)=>{const p=poses[i];if(!p||p.a<.5||p.z<0)return;
    for(let j=1;j<=3;j++){const q=m.ghost(i,t-.05*j,st,ctx);if(!q||q.a<.3)continue;const s=api.S(q.x,q.y);
      fxAdd({k:'dot',x:s[0],y:s[1],s:(1-j*.22)*(.9+.4*g.fs*.3),c:'#fbfaf6',a:.75-.15*j})}});
  /* ---- shadow ---- */
  const hgt=Math.max(b.y,0);const sc=1/(1+hgt/230);
  const rx=lerp(200,200,clamp(o))*K*.93*sc*(1+(1-b.sy)*.45);
  shadow.setAttribute('cx',f2(curSX+b.x*K));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(rx));shadow.setAttribute('ry',f2(rx*.15));shadow.setAttribute('opacity',f2(.95*(.4+.6*sc)));
  /* ---- world ---- */
  let sc2=0;if(cur==='hop'&&m.scroll)sc2=m.scroll(t);
  tuftsM.setAttribute('transform',`translate(${f2(-(sc2%240))} 0)`);farM.setAttribute('transform',`translate(${f2(-((sc2*.3)%480))} 0)`);
  let shk=0;
  if(cur==='unfold'&&t>UT&&t<UT+.6)shk=exp(-8*(t-UT))*sin(60*(t-UT))*6;
  if(cur==='dive'){const tt=t-AO;if(tt>0&&tt<.6)shk+=exp(-8*tt)*sin(60*tt)*5;shk+=m.shake(t)}
  if(cur==='hurt'&&t>HT&&t<HT+.4)shk=exp(-9*(t-HT))*sin(70*(t-HT))*7;
  if(cur==='happy'){const tt=t-2.7;if(tt>0&&tt<.4)shk=exp(-9*tt)*sin(60*tt)*3}
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  /* ---- target (dive only) ---- */
  if(cur==='dive'){
    const ap=eob((t-.3)/.45)*(1-sm((t-7.3)/.35));
    let rot=0,sq=0,bsp=0;
    for(let k=0;k<6;k++){const tau=t-AT(k).DS-.34;if(tau>0){const dir=k%2?-1:1;rot+=dir*(k==5?26:13)*exp(-5*tau)*sin(22*tau);sq+=(k==5?.2:.1)*exp(-9*tau)*cos(26*tau);if(k==5)bsp=360*eoc(tau/.7)}}
    tgt.setAttribute('opacity',ap>.01?1:0);
    tgt.setAttribute('transform',`translate(${TC[0]} 540) rotate(${f2(rot)}) scale(${f2(Math.max(ap,.01)*(1+sq))} ${f2(Math.max(ap,.01)*(1-sq))})`);
    tgtBoard.setAttribute('transform',`translate(0 -150) rotate(${f2(bsp)})`);
  }else tgt.setAttribute('opacity',0);
  /* ---- glow / flash / words ---- */
  if(glowOn>.01){const [gx,gy]=api.S(glowPos[0],glowPos[1]);glowC.setAttribute('cx',f2(gx));glowC.setAttribute('cy',f2(gy));glowC.setAttribute('r',f2(250*K*(1.3-glowOn*.4)));glowC.setAttribute('opacity',f2(glowOn))}else glowC.setAttribute('opacity',0);
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  drawFx();
}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setForm(f){form=f;document.querySelectorAll('[data-form]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.form===f))}
document.querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>setForm(+b.dataset.form));
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1);else if(k==='f'||k==='F')setForm(form?0:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__punkin={seek(mode,t,f){if(f!=null)setForm(f);setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();
