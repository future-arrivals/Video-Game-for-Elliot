<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old Howler: character animation demo</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1a1a;--paper:#efe9dc;--sheet:#FBF8F0;--orange:#E8921C;--yellow:#FFF1A8;--mute:#5b554b}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Andika,"Avenir Next Rounded","Arial Rounded MT Bold",Verdana,"DejaVu Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:14px 20px 0;display:flex;align-items:center;gap:14px}
.chip{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--orange);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;text-shadow:0 2px 0 var(--ink);flex:none}
h1{margin:0;font-size:22px;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:3px}
main{width:100%;max-width:1100px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{position:relative;width:min(100%,calc((100vh - 230px)*1.6));aspect-ratio:960/600;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 18% 8%,rgba(255,236,170,.65),rgba(255,236,170,0) 60%),
   repeating-linear-gradient(0deg,rgba(120,150,190,.13) 0 1.5px,transparent 1.5px 34px),
   var(--sheet);
  box-shadow:0 3px 0 rgba(0,0,0,.18),0 12px 24px -12px rgba(80,60,20,.35)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:10px;font-weight:800;font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(-1.5deg);z-index:2}
.badge{position:absolute;right:12px;top:10px;font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px;transform:rotate(1.5deg);z-index:2;display:none}
.badge.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:800 15px inherit;font-family:inherit;color:var(--ink);padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button[aria-pressed=true]{background:var(--yellow)}
button kbd{font:inherit;font-size:12px;opacity:.55;margin-right:5px}
.seg{display:flex;gap:6px;align-items:center}
.seg span{font-size:13px;color:var(--mute);font-weight:700}
.seg button{padding:5px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.thumb{width:26px;height:18px;vertical-align:-4px;margin-right:4px}
#cap{max-width:900px;font-size:14px;line-height:1.45;color:#3d382f;text-align:center;margin:2px 0 0}
#cap b{color:var(--ink)}
@media (max-height:520px){
  header{display:none}
  main{padding:6px 10px;gap:6px}
  .stage{width:min(100%,calc((100vh - 104px)*1.6))}
  #cap{display:none}
  button{padding:5px 9px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  .seg button{padding:3px 7px;font-size:11px}
  .tag{font-size:12px}
}
@media (max-width:640px) and (min-height:521px){ .stage{width:100%} h1{font-size:18px} }
</style>
<style>
.chip{background:#7e63c9;color:#fff}
.btn-plain{}
</style></head>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t);return t*t*(3-2*t)};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t),3);
const eic=t=>{t=clamp(t);return t*t*t};
const TAU=Math.PI*2;
const sin=Math.sin,cos=Math.cos,exp=Math.exp,PI=Math.PI;
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=0;i<k.length-1;i++)if(t<k[i+1][0]){const u=(t-k[i][0])/(k[i+1][0]-k[i][0]);return lerp(k[i][1],k[i+1][1],sm(u))}return k[k.length-1][1]}
const wrap=(t,d)=>((t%d)+d)%d;
const f2=n=>Math.round(n*100)/100;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- stage constants ---------- */
const SX=480,SY0=296,GY=540,BASE=1.1,PX=200,PY=410;   // stage centre, screen height of body centre, scale, rig pivot (character units)
const SVG='http://www.w3.org/2000/svg';
const rig=$('#rig'),shadow=$('#shadow'),worldEl=$('#world'),fxG=$('#fx'),fxB=$('#fxBack'),word=$('#word'),glowC=$('#glowC'),fm=$('#fm');
const cams=[1,2,3].map(i=>({el:$('#cam'+i),inn:$('#cam'+i+'in')}));

/* ---------- parts ---------- */
const PARTS={'arm-r':[268,322],'arm-l':[122,352],'eye-a':[176,303],'eye-b':[231,296],'mouth':[212,336],'brow-a':[176,276],'brow-b':[232,272]};
const P={};for(const id in PARTS)P[id]={el:rig.querySelector('#'+id),piv:PARTS[id],last:''};
const bodyEl=rig.querySelector('#body-path');
const bodyTok=bodyEl.getAttribute('d').match(/[A-Za-z]|-?\d+\.?\d*/g);

/* ---------- body bend: hem lags, waves ---------- */
let bend={sw:0,wv:0,ph:0};
function D(x,y){const u=clamp((y-256)/310);return[x+bend.sw*u*u+bend.wv*u*sin(4.2*u-bend.ph),y]}
function drawBody(){let o='',i=0;while(i<bodyTok.length){const c=bodyTok[i];
  if(/[A-Za-z]/.test(c)){o+=c;i++;continue}
  const p=D(+bodyTok[i],+bodyTok[i+1]);o+=f2(p[0])+' '+f2(p[1])+' ';i+=2}
  bodyEl.setAttribute('d',o)}

/* ---------- accumulate per-part pose ---------- */
let acc={};
function add(id,o){const a=acc[id]||(acc[id]={x:0,y:0,r:0,sx:1,sy:1,k:0});
  if(o.x)a.x+=o.x;if(o.y)a.y+=o.y;if(o.r)a.r+=o.r;if(o.k)a.k+=o.k;if(o.sx)a.sx*=o.sx;if(o.sy)a.sy*=o.sy}

/* ---------- ground scribbles ---------- */
(function(){
  const g=$('#tufts'),far=$('#far');const R=rng(7);
  let h='';
  for(let i=-1;i<6;i++){const x=i*240;
    h+=`<path d="M${x+60} 580 l-6 -20 M${x+66} 580 l2 -26 M${x+72} 580 l8 -20" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    h+=`<path d="M${x+172} 584 v-22" stroke="#4aa24a" stroke-width="4" stroke-linecap="round"/><circle cx="${x+172}" cy="556" r="9" fill="#c9b8f0" stroke="#1a1a1a" stroke-width="3.5"/><circle cx="${x+172}" cy="556" r="3" fill="#FFD23C"/>`;
    h+=`<ellipse cx="${x+120}" cy="590" rx="11" ry="6" fill="#d9cfb8" stroke="#1a1a1a" stroke-width="3"/>`;
  }
  g.innerHTML=`<g id="tuftsM">${h}</g>`;
  let f='';
  for(let i=-1;i<4;i++){const x=i*480;
    f+=`<path d="M${x+120} 150 c-30 0 -34 -34 -6 -38 c4 -26 40 -28 50 -8 c24 -8 44 14 28 30 c8 14 -8 18 -22 16 Z" fill="#fff" stroke="#b7c2d3" stroke-width="3.5" stroke-linejoin="round" opacity=".85"/>`;
    f+=`<path d="M${x+380} 96 c-20 0 -22 -22 -4 -26 c4 -16 28 -18 34 -4 c16 -4 28 10 18 20 Z" fill="#fff" stroke="#b7c2d3" stroke-width="3" stroke-linejoin="round" opacity=".8"/>`;
  }
  f+=`<g transform="translate(830 88)" opacity=".9"><circle r="30" fill="#E9E1FF" stroke="#a58be0" stroke-width="3.5"/><path d="M-12 -10 a22 22 0 1 0 0 40 a17 17 0 1 1 0 -40z" fill="#c9b8f0" stroke="none" opacity=".0"/></g>`;
  far.innerHTML=`<g id="farM">${f}</g>`;
})();
const tuftsM=$('#tuftsM'),farM=$('#farM');

/* ---------- fx pool ---------- */
function mkPool(parent,n){const a=[];for(let i=0;i<n;i++){const u=document.createElementNS(SVG,'use');u.setAttribute('stroke','#1a1a1a');u.setAttribute('stroke-width','2.5');u.style.display='none';parent.appendChild(u);a.push(u)}return a}
const pool=mkPool(fxG,56),poolB=mkPool(fxB,32);
let fxList=[];
const fxAdd=o=>fxList.push(o);
function drawFx(){
  let i=0,j=0;
  for(const o of fxList){const pl=o.b?poolB:pool;const n=o.b?j++:i++;if(n>=pl.length)continue;const u=pl[n];
    u.style.display='';u.setAttribute('href','#s-'+o.k);u.setAttribute('fill',o.c);u.setAttribute('opacity',f2(o.a==null?1:o.a));
    u.setAttribute('transform',`translate(${f2(o.x)} ${f2(o.y)}) rotate(${f2(o.r||0)}) scale(${f2(o.sx||o.s)} ${f2(o.s)})`);u.setAttribute('stroke-width',f2(o.sw?o.sw/Math.max(o.s,.3):2.5/Math.max(o.s,.3)));u.setAttribute('stroke',o.st||'#1a1a1a')}
  for(;i<pool.length;i++)pool[i].style.display='none';
  for(;j<poolB.length;j++)poolB[j].style.display='none';
}
const COL=['#c9b8f0','#FFD23C','#7cc3e8','#f06a8a','#a58be0','#fbfaf6','#8fdc9a'];
function confetti(t,t0,ox,oy,n,seed,speed=520,life=1.6){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=-PI/2+(R()-.5)*2.3,v=speed*(.45+R()*.7),vx=cos(a)*v,vy=sin(a)*v;
    fxAdd({k:i%3?'scrap':'star',x:ox+vx*tau,y:oy+vy*tau+.5*900*tau*tau,s:(i%3?1.1:.9)*(.8+R()*.6),r:R()*360+tau*(R()-.5)*900,c:COL[i%COL.length],a:1-sm((tau-life*.55)/(life*.45))})}}
function sparkles(t,t0,ox,oy,n,seed,rad=170,life=.9){const tau=t-t0;if(tau<0||tau>life)return;const R=rng(seed);
  for(let i=0;i<n;i++){const a=R()*TAU,d=rad*(.3+R()*.7)*eoc(tau/.5);const s=(.5+R()*.8)*sin(PI*clamp(tau/life));
    fxAdd({k:'spark',x:ox+cos(a)*d,y:oy+sin(a)*d*.8-tau*30,s:Math.max(s,.01),r:tau*120*(R()-.5)*3,c:i%2?'#fbfaf6':'#c9b8f0',a:1})}}
function wordPop(txt,x,y,t,t0,life,rot=-8,sc=1){const tau=t-t0;if(tau<0||tau>life){return false}
  const s=eob(tau/.14)*(1-sm((tau-life+.15)/.15)*.3);word.textContent=txt;word.setAttribute('opacity',f2(1-sm((tau-life+.12)/.12)));
  word.setAttribute('transform',`translate(${f2(x)} ${f2(y)}) rotate(${rot}) scale(${f2(Math.max(s*sc,.01))})`);return true}

/* ---------- blink (global time) ---------- */
const blinks=[];(function(){const R=rng(11);let t=1.1;for(let i=0;i<400;i++){blinks.push(t);const r=R();if(r<.18){blinks.push(t+.26)}t+=1.3+R()*3.4+(r>.85?2.2:0)}})();
function blinkAmt(T){let lo=0,hi=blinks.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(blinks[m]<=T)lo=m;else hi=m-1}
  const d=T-blinks[lo];if(d<0||d>.2)return 0;return d<.07?d/.07:1-sm((d-.07)/.13)}

/* ---------- modes ---------- */
const B=o=>Object.assign({x:0,y:0,r:0,sx:1,sy:1,op:1,zoom:1},o);
const vol=sy=>1+(1-sy)*.6;
const bob=t=>sin(TAU*t/3.8);
const cl=(x,m)=>clamp(x,-m,m);
const M={};
/* 1: idle */
M.idle={name:'Idle',dur:7.6,
 caption:'<b>Idle.</b> Old Howler hangs in the air like a big slow balloon: a deep, heavy bob, slow breathing, the raised arm drifting a beat behind the body and the <b>hem rippling lazily</b>. Eyes blink rarely. Every cycle he does a low <b>grumble</b> (brows drop, body rumbles, a puff of air) and then a <b>come-here wave</b> with his big arm.',
 state(t){const g=sm((t-3.2)/.5)*(1-sm((t-4.9)/.35)),rum=g*sin(TAU*13*t)*(t>3.6&&t<4.7?1:.0);
  const sy=1+.03*sin(TAU*t/3.8+1);
  return{b:B({y:8*bob(t),x:1.8*rum,r:1.5*sin(TAU*t/5.7)-3*g,sy:sy-.015*g,sx:vol(sy)}),mo:.35*g,brow:g,g}},
 extra(t,st,T,A,api){const g=st.g;
  A('arm-r',{r:-5*sin(TAU*t/3.8-.8)+(t>5.4&&t<7.2?-16*sin(PI*(t-5.4)/1.8)*sin(TAU*(t-5.4)*1.4):0)-g*8});A('arm-l',{r:7*sin(TAU*t/3.8-1.3)+g*6});
  A('eye-a',{sy:1-.15*g});A('eye-b',{sy:1-.15*g});
  if(t>5.2&&t<6.9){const k=sm((t-5.2)/.2)*(1-sm((t-6.5)/.3));A('eye-a',{x:-6*k});A('eye-b',{x:-6*k})}
  const [mx,my]=api.S(212,360);
  if(t>4.7&&t<5.5){const u=(t-4.7)/.8;for(let i=0;i<4;i++){fxAdd({k:'dot',x:mx+(i-1.5)*18+u*(i-1.5)*40,y:my+30+u*90,s:.9*(1-u),c:'#c9b8f0',a:1-u})}}
 },bend(t,T){return{sw:0,wv:7,ph:T*2.4}}};
/* 2: glide */
M.glide={name:'Glide',dur:4.8,
 caption:'<b>Glide.</b> He never runs; he <b>glides like a heavy cloud</b>. Slow bob, a forward lean, the hem trailing behind in a long travelling wave, the big arm swinging with weight a beat after the body and the left arm trailing. The ground scrolls at twice the speed of the clouds.',
 state(t){const c=TAU*t/2.4;return{b:B({y:11*sin(c),r:7+2*sin(c-1.2),sy:1+.03*sin(c+.6),sx:1-.02*sin(c+.6)}),mo:.1,brow:.35}},
 extra(t,st,T,A){const c=TAU*t/2.4;
  A('arm-r',{r:8+11*sin(c-1)});A('arm-l',{r:12+12*sin(c-.5)});A('eye-a',{x:3});A('eye-b',{x:3})},
 bend(t,T){const c=TAU*t/2.4;return{sw:-40+6*sin(c),wv:10,ph:TAU*t/1.2}},
 scroll(t){return t*100}};
/* 3: howl */
const HS=1.6,HE=3.7;
function howlD(t){let z=0,sx=1,sy=1,r=0,x=0,mo=0,arm=0,eye=0,brow=0,y=0;
  if(t>=.7&&t<HS){const i=sm((t-.7)/.85);z=-.05*i;sy=1-.07*i;r=-9*i;x=-8*i+2.4*i*sin(TAU*13*t);mo=-.35*i;arm=-.8*i;eye=i;brow=i;y=-6*i}
  else if(t>=HS){const u=t-HS;
    if(t<HE){const s=eob(u/.3);const k=1+.014*sin(TAU*11*t);
      z=lerp(-.05,.2,s)*k;sx=lerp(1,1.15,s);sy=lerp(.93,1.08,s);r=lerp(-9,-6,s)+2*sin(TAU*7*t);x=lerp(-8,0,s)+2*sin(TAU*15*t);
      mo=lerp(-.35,1,eob(u/.2));arm=lerp(-.8,1,s);eye=lerp(1,.6,s);brow=1;y=lerp(-6,14,s)}
    else{const d=t-HE;const e=exp(-6*d)*cos(14*d);
      z=.2*e;sx=1+.15*e;sy=1+.08*e-.03*(1-exp(-8*d))*exp(-3*d);r=-6*exp(-5*d)*cos(10*d);x=0;mo=Math.max(0,exp(-9*d));arm=exp(-5*d);eye=.3*exp(-4*d);brow=exp(-3*d);y=14*exp(-6*d)}}
  return{z,sx,sy,r,x,mo,arm,eye,brow,y}}
M.howl={name:'Howl (power)',dur:5.8,
 caption:'<b>Howl, his big move.</b> He sucks in air (pulls back, eyes squeezed, a rising rumble), then <b>swells and the mouth stretches wide open</b> while his head tips back. Shockwave rings roll out across the stage, speed lines fly, the screen shakes and <b>HOOOWL!</b> pops up. Then he deflates with a wobbling spring and a satisfied puff.',
 state(t){const d=howlD(t);const bs=1+.025*sin(TAU*t/3.8+1)*(t<.7||t>HE+1?1:0);
  return{b:B({y:8*bob(t)*(t<.7||t>HE+1.2?1:0)+d.y,x:d.x,r:d.r,sx:d.sx*vol(bs),sy:d.sy*bs,zoom:1+d.z}),mo:d.mo,brow:d.brow,d}},
 extra(t,st,T,A,api){const d=st.d;
  A('arm-r',{r:-52*d.arm*(d.arm>0?1:-.6)-5*sin(TAU*9*t)*(t>HS&&t<HE?d.arm:0)});A('arm-l',{r:50*d.arm*(d.arm>0?1:-.6)+5*sin(TAU*9*t+1)*(t>HS&&t<HE?d.arm:0)});
  A('eye-a',{sy:1-.5*d.eye+(d.arm>0?.18*d.arm:0),sx:1+.22*d.arm});A('eye-b',{sy:1-.5*d.eye+(d.arm>0?.18*d.arm:0),sx:1+.22*d.arm});
  const [mx,my]=api.S(212,350);
  for(let j=0;j<5;j++){const tau=t-(HS+.05+j*.45);if(tau>0&&tau<1.25){const s=.4+17*eoc(tau/1.25);const a=1-sm((tau-.55)/.7);
    fxAdd({b:1,k:'ring',x:mx,y:my,s,sx:s*1.2,c:'none',st:'#1a1a1a',sw:12,a});
    fxAdd({b:1,k:'ring',x:mx,y:my,s:s*.985,sx:s*1.2*.985,c:'none',st:j%2?'#FFD23C':'#c9b8f0',sw:6,a})}}
  if(t>HS&&t<HE+.3){const fade=sm((t-HS)/.2)*(1-sm((t-HE)/.3));
    for(let k=0;k<12;k++){const ph=((t*1.5+k*.131)%1),a=k*TAU/12+.2,rr=130+ph*520;
      fxAdd({k:'line',x:mx+cos(a)*rr*1.25,y:my+sin(a)*rr*.85,s:.9,sx:1.3,r:a*180/PI,c:k%2?'#a58be0':'#FFD23C',a:fade*(1-ph*.8)})}}
  api.word('HOOOWL!',SX-270,160,t,HS+.1,1.9,-6,1.05);
  if(t>HE+.35&&t<HE+1.2){const u=(t-HE-.35)/.85;for(let i=0;i<4;i++)fxAdd({k:'dot',x:mx+(i-1.5)*24+u*(i-1.5)*50,y:my+40+u*70,s:.9*(1-u),c:'#c9b8f0',a:1-u})}
 },
 bend(t,T,b,v){const on=t>HS&&t<HE;const post=t>=HE?exp(-4*(t-HE)):0;return{sw:on?-18:cl(-v.x*.05,25)+post*-20,wv:on?18:8+post*14,ph:T*(on?11:3)}},

/* 4: swoop */
const SEV=[{s:.4,dir:1},{s:2.7,dir:-1}];
function swD(t){const o={x:0,y:0,z:0,r:0,sy:0,brow:0,arm:0,mo:0,hit:0,dive:0};
  for(const e of SEV){const tau=t-e.s,d=e.dir;if(tau<0||tau>2.5)continue;let x,y,z,r,sy,brow,arm,mo,hit=0,dive=0;
    if(tau<.65){const u=sm(tau/.65);x=-d*70*u;y=30*u;r=-d*14*u;z=-.07*u;sy=-.08*u;brow=u;arm=u;mo=.2*u}
    else if(tau<1.15){const v=(tau-.65)/.5,w=sm(v);x=lerp(-d*70,d*190,w);y=lerp(30,-60,w);r=d*lerp(-14,20,w);z=lerp(-.07,.1,w)+.35*sin(PI*v);sy=lerp(-.08,.06,w);brow=1;arm=1-.4*w;mo=lerp(.2,.6,sm(v*3));dive=1}
    else if(tau<1.4){const q=(tau-1.15)/.25;x=d*190;y=-60;r=d*20;z=.1;sy=lerp(.06,-.08,sm(q*4));brow=1;arm=.6;mo=.6;hit=1-q}
    else{const u=sm((tau-1.4)/1.1);x=d*190*(1-u);y=-60*(1-u);r=d*20*(1-u)+4*d*exp(-6*(tau-1.4))*sin(14*(tau-1.4));z=.1*(1-u);sy=-.08*(1-u)+.03*exp(-5*(tau-1.4))*sin(18*(tau-1.4));brow=1-u;arm=.6*(1-u);mo=.6*(1-u)}
    o.x+=x;o.y+=y;o.z+=z;o.r+=r;o.sy+=sy;o.brow+=brow;o.arm+=arm;o.mo+=mo;o.hit+=hit;o.dive+=dive}
  return o}
M.swoop={name:'Swoop (attack)',dur:5.4,
 caption:'<b>Swoop, his attack.</b> A slow, heavy wind-up (he rises and leans back, <b>angry brows</b> drop, arms spread), then a fast <b>dive across the stage toward the camera</b> with the hem streaming behind and speed streaks trailing. A star-burst lands the hit with a screen shake, then he lazily floats home. The second swoop goes the other way.',
 state(t){const d=swD(t);const sy=1+d.sy+.025*bob(t);
  return{b:B({y:8*bob(t)+d.y,x:d.x,r:d.r,sy,sx:vol(sy)*(1+d.z*.15),zoom:1+d.z}),mo:d.mo,brow:clamp(d.brow),d}},
 extra(t,st,T,A,api){const d=st.d;
  A('arm-r',{r:-34*d.arm});A('arm-l',{r:34*d.arm});A('eye-a',{sy:1-.25*clamp(d.brow),sx:1+.1*d.dive});A('eye-b',{sy:1-.25*clamp(d.brow),sx:1+.1*d.dive});
  SEV.forEach((e,i)=>{const tau=t-e.s;
    if(tau>.65&&tau<1.15){for(let k=1;k<=7;k++){const q=api.lag(.025*k);const [px,py]=api.Sat(q,PX,PY-20);const sp=Math.abs(curB.x-q.x)+Math.abs(curB.y-q.y);
      fxAdd({b:1,k:'line',x:px,y:py+(k%2?22:-22),s:.8,sx:1.2+.2*k,r:Math.atan2(curB.y-q.y,curB.x-q.x)*-180/PI,c:k%2?'#a58be0':'#FFD23C',a:clamp(sp/18)*(1-k/9)})}}
    if(tau>1.12&&tau<1.7){const [hx,hy]=api.S(PX+e.dir*130,PY+10);const s=eob((tau-1.12)/.1)*(1-sm((tau-1.35)/.35));fxAdd({k:'spike',x:hx,y:hy,s:2.7*s,r:tau*40,c:'#FFD23C',a:1})}
    api.word(i?'SWOOSH!':'SWOOP!',SX-e.dir*0+(i?200:-200),120,t,e.s+.62,.7,i?8:-8)});
 },
 bend(t,T,b,v){const d=swD(t);return{sw:cl(-v.x*.06,70)-(d.dive?15:0),wv:8+cl(Math.abs(v.x)*.02,18),ph:T*6}},
 shake(t){let s=0;for(const e of SEV){const tau=t-e.s-1.15;if(tau>0&&tau<.45)s+=exp(-9*tau)*sin(70*tau)*9}return s}};
/* 5: hurt */
const HT=.45;
function flashAt(h){if(h<0)return null;if(h<.06)return{a:.8,c:[1,1,1]};if(h<.12)return{a:.0,c:[1,1,1]};if(h<.2)return{a:.7,c:[1,1,1]};
  if(h<.8)return{a:.55*exp(-5*(h-.2)),c:[1,.35,.32]};return null}
M.hurt={name:'Ouch! (hurt)',dur:4.8,
 caption:'<b>Ouch.</b> A white then pink flash and a knockback that is shorter than the little ghosts get (he is heavy), with a slow squash and wobble, a flicker, bulging eyes and a gaping mouth. He floats back, then <b>glares and grumbles</b>: angry brows, puffs of steam and a shaking fist, which is as scary as he gets.',
 state(t){const h=t-HT;let x=0,y=8*bob(t),r=0,sx=1,sy=1+.025*sin(TAU*t/3.8+1),op=1,mo=0,brow=0;
  if(h>0){x=-70*eoc(h/.5);if(h>1.5)x=-70*(1-sm((h-1.5)/1));
    y+=26*sin(PI*clamp(h/.55))+(h>1.5&&h<2.4?8*sin(PI*(h-1.5)/.9):0);
    r=-15*exp(-3.2*h)*cos(10*h);
    sx=1-.2*exp(-7*h)*cos(20*h);sy=1+.24*exp(-7*h)*cos(20*h);
    if(h>.08&&h<.8)op=.6+.4*(sin(30*h)>0?1:0);
    mo=h<1.7?clamp(.9*exp(-1.2*h)*(1+.25*sin(16*h)),0,1.2):0;
    brow=sm((h-2.0)/.4)*(1-sm((h-3.5)/.4))}
  return{b:B({x,y,r,sx,sy,op}),mo:mo+(h>2.3&&h<3.5?.25:0),brow,flash:flashAt(h)}},
 extra(t,st,T,A,api){const h=t-HT;
  if(h>0){const w=exp(-2.4*h);
   A('eye-a',{sx:1+.35*exp(-1.4*h),sy:1+.35*exp(-1.4*h)});A('eye-b',{sx:1+.35*exp(-1.4*h),sy:1+.35*exp(-1.4*h)});
   A('arm-r',{r:-(30+26*cos(13*h))*w});A('arm-l',{r:(30+26*cos(13*h+.5))*w});
   if(h>2.0&&h<3.9){const k=sm((h-2.0)/.3)*(1-sm((h-3.5)/.4));A('arm-r',{r:-22*k+9*k*sin(TAU*5*h)});A('arm-l',{r:14*k});A('eye-a',{sy:1-.25*k});A('eye-b',{sy:1-.25*k});
     const [lx,ly]=api.S(130,300),[rx,ry]=api.S(272,300);
     for(let i=0;i<4;i++){const ph=((h*1.4+i*.25)%1);fxAdd({k:'dot',x:lx-10-ph*30+i*4,y:ly-ph*90,s:1.9*(1-ph*.6),c:'#c9b8f0',a:(1-ph)*k});fxAdd({k:'dot',x:rx+10+ph*30-i*4,y:ry-ph*90,s:1.9*(1-ph*.6),c:'#c9b8f0',a:(1-ph)*k})}}
   const [bx,by]=api.S(PX+60,380);
   if(h<.3){const s=eob(h/.1)*(1-sm((h-.18)/.12));fxAdd({k:'spike',x:bx+30,y:by-10,s:2.5*s,r:h*60,c:'#FFD23C',a:1})}
   api.word('OUCH!',SX-190,118,t,HT+.04,.85,-10);
   if(h>.4&&h<1.9){const a=1-sm((h-1.5)/.4),[hx,hy]=api.S(PX,262);
     for(let i=0;i<3;i++){const an=h*5+i*TAU/3;fxAdd({k:'star',x:hx+cos(an)*80,y:hy+sin(an)*20-sm((h-.4)/.15)*8,s:.9+.2*sin(an+1),r:an*40,c:i==1?'#f06a8a':'#FFD23C',a})}}
  }},
 bend(t,T){const h=t-HT;const w=h>0?exp(-2.2*h):0;return{sw:-55*w*cos(9*h)||0,wv:7+14*w,ph:T*8}},
 shake(t){const h=t-HT;return h>0&&h<.45?exp(-8*h)*sin(70*h)*8:0}};
/* 6: yay */
const CAMS=[{x0:-120,x1:165,y:340,cx:143,cy:118,t0:1.2,s:.5,ph:0},{x0:1080,x1:800,y:360,cx:122,cy:108,t0:1.55,s:.5,ph:1.4},{x0:1080,x1:850,y:175,cx:130,cy:96,t0:1.9,s:.46,ph:2.7}];
M.happy={name:'Yay! (happy)',dur:5.2,
 caption:'<b>Celebrate.</b> The boss gets a <b>big belly laugh</b>: the mouth pulses open and shut in a HA-HA-HA rhythm, the belly jiggles, the eyes squeeze happy, and he rocks and takes two slow, heavy hops. Spook and the other ghosts float in to the party, and the confetti flies, because in the story Old Howler only wanted a party.',
 state(t){const hop=(s,e,H)=>{const u=(t-s)/(e-s);return u>0&&u<1?H*4*u*(1-u):0};
  const lau=sm((t-.4)/.3)*(1-sm((t-4.4)/.4));const lg=sin(TAU*5*t);
  const y=8*bob(t)*(1-lau)+hop(.6,1.5,60)+hop(2.7,3.7,80);
  const sy=keys(t,[[0,1],[.25,.84],[.45,.86],[.55,1.14],[1.1,1.05],[1.5,1.08],[1.6,.82],[1.75,1.05],[1.95,1],[2.4,1],[2.55,.82],[2.7,.84],[2.8,1.16],[3.3,1.05],[3.7,1.1],[3.8,.8],[3.95,1.05],[4.1,1],[5.2,1]]);
  const jig=lau*.035*lg;
  const r=lau*(7*sin(TAU*t/1.3));
  return{b:B({y,r,sy:sy+jig,sx:vol(sy)-jig*.8}),mo:lau*(.45+.5*(.5+.5*lg)),brow:0,lau}},
 extra(t,st,T,A,api){const lau=st.lau;
  const up=keys(t,[[0,0],[.5,0],[.6,.9],[1.5,1],[1.8,.3],[2.6,.3],[2.75,1],[3.7,1],[4.0,.2],[5.2,0]]);
  A('arm-r',{r:-(up*(24+10*sin(TAU*3*t))+8*lau*sin(TAU*5*t+.5))});A('arm-l',{r:up*(46+10*sin(TAU*3*t+1))+8*lau*sin(TAU*5*t+2)});
  A('eye-a',{sy:1-.65*lau,sx:1+.12*lau});A('eye-b',{sy:1-.65*lau,sx:1+.12*lau});
  const [cx,cy]=api.S(PX,PY);
  confetti(t,.95,cx,cy-150,22,5,560,1.7);confetti(t,3.1,cx,cy-150,32,8,700,1.9);
  api.word('HA HA HA!',cx-210,150,t,.65,1.2,-8,.95);api.word('PARTY!',cx+220,150,t,2.8,1.1,8);
  CAMS.forEach((c,i)=>{const e=cams[i];const u=t-c.t0;if(u<0){e.el.setAttribute('display','none');return}e.el.removeAttribute('display');
    const k=eob(u/.5),xx=lerp(c.x0,c.x1,eoc(u/.6));
    let yy=c.y+8*sin(TAU*(t+c.ph)/1.3),rr=7*sin(TAU*(t+c.ph)/1.7),ss=1;
    const j=t-2.9-c.ph*.05;if(j>0&&j<.8){yy-=75*sin(PI*j/.8);ss=1+.1*sin(PI*j/.8)*(j<.4?1:-1)}
    const fade=t>4.7?1-sm((t-4.7)/.4):1;
    e.el.setAttribute('transform',`translate(${f2(xx)} ${f2(yy)}) rotate(${f2(rr)}) scale(${f2(c.s*Math.max(k,.01)*ss)}) translate(${-c.cx} ${-c.cy})`);
    e.el.setAttribute('opacity',f2(fade))})
 },
 bend(t,T,b,v){const lau=st_lau(t);return{sw:cl(-v.x*.05,30),wv:7+8*lau+cl(Math.abs(v.y)*.02,10),ph:T*5}}};
function st_lau(t){return sm((t-.4)/.3)*(1-sm((t-4.4)/.4))}
const ORDER=['idle','glide','howl','swoop','hurt','happy'];
const LABEL={idle:'Idle',glide:'Glide',howl:'Howl',swoop:'Swoop',hurt:'Ouch',happy:'Yay'};

/* ---------- render ---------- */
let K=BASE,curB=null,lagFn=null;
const api={S:(cx,cy)=>[SX+(cx-PX+curB.x)*K,SY0+(cy-PY-curB.y)*K],
  Sat:(q,cx,cy)=>[SX+(cx-PX+q.x)*K,SY0+(cy-PY-q.y)*K],
  lag:d=>lagFn(d),
  word:(txt,x,y,t,t0,life,rot,sc)=>{if(wordPop(txt,x,y,t,t0,life,rot,sc))wordShown=true}};
let wordShown=false;
let cur='idle',t0=0,speed=1,paused=false,T=0;
function render(T){
  const m=M[cur];const t=wrap(T-t0,m.dur);
  const st=m.state(t);const b=st.b;curB=b;K=BASE*b.zoom;acc={};fxList=[];wordShown=false;
  const lag=d=>m.state(wrap(t-d,m.dur)).b;lagFn=lag;
  const vel=d=>{const a=lag(d),c=lag(d+.04);return{x:(a.x-c.x)/.04,y:(a.y-c.y)/.04,r:(a.r-c.r)/.04,sy:(a.sy-c.sy)/.04}};
  const v2=vel(.09),v3=vel(.15);
  /* shared secondary motion: heavy arms lag more than Spook's */
  A('arm-r',{r:cl(v3.y*.035,32)+cl(v3.x*.02,16)-cl(v3.r*.12,14)-2*sin(1.1*T)});
  A('arm-l',{r:-cl(v2.y*.035,32)-cl(v2.x*.02,16)+cl(v2.r*.12,14)+2*sin(1.3*T+1)});
  for(const id of ['eye-a','eye-b','mouth']){A(id,{x:cl(-v2.x*.015,4),y:cl(v2.y*.008,3)})}
  const lx=3*sin(.5*T)+1.4*sin(1.5*T+1),ly=1.2*sin(.8*T+2);const bl=blinkAmt(T);
  A('eye-a',{x:lx,y:ly,sy:1-.92*bl});A('eye-b',{x:lx,y:ly,sy:1-.92*bl});A('mouth',{x:lx*.4});
  /* mouth stretch (mo<0 = pursed) */
  const mo=st.mo||0;
  A('mouth',{sx:1+.7*mo,sy:Math.max(1+1.4*mo,.5)});
  /* angry brows fade in */
  const br=clamp(st.brow||0);
  P['brow-a'].el.setAttribute('opacity',f2(br));P['brow-b'].el.setAttribute('opacity',f2(br));
  A('brow-a',{y:-7*(1-br)});A('brow-b',{y:-7*(1-br)});
  m.extra(t,st,T,add,api);
  const bd=m.bend(t,T,b,v2);bend=bd;drawBody();
  rig.setAttribute('transform',`translate(${SX} ${SY0}) scale(${f2(K)}) translate(${f2(b.x)} ${f2(-b.y)}) rotate(${f2(b.r)}) scale(${f2(b.sx)} ${f2(b.sy)}) translate(${-PX} ${-PY})`);
  rig.setAttribute('opacity',f2(b.op));
  for(const id in P){const p=P[id],a=acc[id]||{x:0,y:0,r:0,sx:1,sy:1,k:0};const pv=p.piv,d=D(pv[0],pv[1]);
    const s=`translate(${f2(d[0]+a.x)} ${f2(pv[1]+a.y)}) rotate(${f2(a.r)}) skewX(${f2(a.k)}) scale(${f2(a.sx)} ${f2(a.sy)}) translate(${-pv[0]} ${-pv[1]})`;
    if(p.last!==s){p.last=s;p.el.setAttribute('transform',s)}}
  const sc=1/(1+Math.max(b.y,0)/220);
  const rx=100*K/1.1*sc*(1+(1-b.sy)*.3)*(.9+.1*b.zoom);
  shadow.setAttribute('cx',f2(SX+b.x*K));shadow.setAttribute('cy',GY+3);shadow.setAttribute('rx',f2(rx));shadow.setAttribute('ry',f2(rx*.15));shadow.setAttribute('opacity',f2((.35+.6*sc)*b.op));
  let sc2=0;if(m.scroll)sc2=m.scroll(t);
  tuftsM.setAttribute('transform',`translate(${f2(-((2*sc2)%240))} 0)`);farM.setAttribute('transform',`translate(${f2(-(sc2%480))} 0)`);
  if(cur!=='happy')cams.forEach(c=>c.el.setAttribute('display','none'));
  const shk=m.shake?m.shake(t):0;
  worldEl.setAttribute('transform',shk?`translate(${f2(shk)} ${f2(shk*.4)})`:'');
  if(!wordShown)word.setAttribute('opacity',0);
  const fl=st.flash||null;
  if(fl&&fl.a>.01){const a=fl.a,c=fl.c;fm.setAttribute('values',`${1-a} 0 0 0 ${a*c[0]} 0 ${1-a} 0 0 ${a*c[1]} 0 0 ${1-a} 0 ${a*c[2]} 0 0 0 1 0`);rig.setAttribute('filter','url(#flash)')}else rig.removeAttribute('filter');
  drawFx();
}
function A(id,o){add(id,o)}

/* ---------- UI ---------- */
const modesBar=$('#modes');
ORDER.forEach((k,i)=>{const b=document.createElement('button');b.dataset.mode=k;b.innerHTML=`<kbd>${i+1}</kbd>${LABEL[k]}`;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>setMode(k);modesBar.appendChild(b)});
function setMode(k){cur=k;t0=T;[...modesBar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===k));$('#tag').textContent=M[k].name;$('#cap').innerHTML=M[k].caption}
function setSpeed(s){speed=s;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===s));$('#badge').classList.toggle('on',s<1);$('#badge').textContent=s+'× slow-mo'}
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
$('#replay').onclick=()=>{t0=T};
function setPause(p){paused=p;$('#pause').innerHTML=`<kbd>Space</kbd>${p?'Play':'Pause'}`}
$('#pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k>='1'&&k<='6'){setMode(ORDER[+k-1])}else if(k===' '){e.preventDefault();setPause(!paused)}
  else if(k==='r'||k==='R')t0=T;else if(k==='s'||k==='S')setSpeed(speed===1?.5:speed===.5?.25:1)});
setMode('idle');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt*speed;render(T);requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
window.__demo={seek(mode,t){setMode(mode);paused=true;T=t;t0=0;render(T)},setSpeed,setPause};
})();
</script>
